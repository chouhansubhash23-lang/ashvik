<!DOCTYPE html>

<style>
  :root { --primary:#0f766e; --primary-dark:#115e59; --primary-light:#ccfbf1; --accent:#2563eb; --bg:#f8fafc; --card:#fff; --text:#0f172a; --muted:#64748b; --border:#e2e8f0; --danger:#dc2626; --warn:#d97706; --success:#16a34a; --radius:14px; }
  * { box-sizing: border-box; }
  html,body { margin:0; padding:0; }
  body { font-family:'Inter','Noto Sans Devanagari','Noto Sans Bengali',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased; }
  .app { display:grid; grid-template-columns:260px 1fr; min-height:100vh; }
  .sidebar { background:linear-gradient(180deg,#0f766e 0%,#115e59 100%); color:#fff; padding:20px 16px; display:flex; flex-direction:column; gap:4px; }
  .brand { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .brand-logo { width:40px; height:40px; border-radius:12px; background:rgba(255,255,255,.18); display:grid; place-items:center; font-weight:700; font-size:19px; }
  .brand h1 { font-size:18px; margin:0; font-weight:700; }
  .brand p { font-size:11px; margin:0; opacity:.75; }
  .nav-btn { display:flex; align-items:center; gap:10px; padding:10px 13px; border:none; background:transparent; color:rgba(255,255,255,.85); border-radius:10px; cursor:pointer; font-size:13.5px; font-weight:500; text-align:left; transition:background .15s,color .15s; width:100%; }
  .nav-btn:hover { background:rgba(255,255,255,.12); color:#fff; }
  .nav-btn.active { background:#fff; color:var(--primary-dark); font-weight:600; }
  .sidebar-foot { margin-top:auto; font-size:11px; opacity:.6; padding-top:12px; border-top:1px solid rgba(255,255,255,.15); }
  .main { padding:24px 28px; overflow-y:auto; }
  .page-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:12px; }
  .page-head h2 { margin:0; font-size:23px; font-weight:700; letter-spacing:-.3px; }
  .page-head p { margin:4px 0 0; color:var(--muted); font-size:13px; }
  .btn { padding:9px 16px; border:none; border-radius:10px; cursor:pointer; font-size:14px; font-weight:600; transition:transform .05s, box-shadow .15s; }
  .btn:active { transform:translateY(1px); }
  .btn-primary { background:var(--primary); color:#fff; box-shadow:0 4px 12px rgba(13,148,136,.25); }
  .btn-primary:hover { background:var(--primary-dark); }
  .btn-outline { background:#fff; border:1px solid var(--border); color:var(--text); }
  .btn-outline:hover { border-color:var(--primary); color:var(--primary); }
  .btn-danger { background:var(--danger); color:#fff; }
  .btn-warn { background:var(--warn); color:#fff; }
  .btn-sm { padding:6px 12px; font-size:12px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; margin-bottom:16px; box-shadow:0 1px 3px rgba(15,23,42,.04); }
  .card-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:8px; flex-wrap:wrap; }
  .card-head h3 { margin:0; font-size:16px; font-weight:600; }
  .card-head .sub { font-size:12px; color:var(--muted); }
  .grid { display:grid; gap:12px; }
  .grid-2 { grid-template-columns:repeat(2,1fr); }
  .grid-3 { grid-template-columns:repeat(3,1fr); }
  .grid-4 { grid-template-columns:repeat(4,1fr); }
  @media (max-width:900px){ .grid-3,.grid-4{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:600px){ .grid-2,.grid-3,.grid-4{grid-template-columns:1fr;} }
  .field { display:flex; flex-direction:column; gap:4px; }
  .field label { font-size:12px; font-weight:500; color:var(--muted); }
  .field input, .field select, .field textarea { padding:9px 12px; border:1px solid var(--border); border-radius:10px; font-size:14px; font-family:inherit; background:#fff; transition:border-color .15s, box-shadow .15s; }
  .field input:focus, .field select:focus, .field textarea:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-light); }
  .field textarea { min-height:60px; resize:vertical; }
  .field input[readonly] { background:#f1f5f9; color:var(--muted); }
  .chip { display:inline-flex; align-items:center; padding:6px 12px; border-radius:999px; font-size:12.5px; font-weight:500; border:1px solid var(--border); background:#fff; cursor:pointer; margin:3px; transition:all .15s; user-select:none; }
  .chip:hover { border-color:var(--primary); color:var(--primary); }
  .chip.active { background:var(--primary); color:#fff; border-color:var(--primary); }
  .alert { padding:12px 14px; border-radius:10px; font-size:13px; margin-bottom:12px; border:1px solid; }
  .alert-info { background:#eff6ff; color:#1e40af; border-color:#bfdbfe; }
  .alert-warn { background:#fffbeb; color:#92400e; border-color:#fde68a; }
  .alert-danger { background:#fef2f2; color:#991b1b; border-color:#fecaca; }
  .alert-success { background:#f0fdf4; color:#166534; border-color:#bbf7d0; }
  .alert ul { margin:6px 0 0 18px; padding:0; }
  .result-item { border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .score-bar { height:6px; background:#e2e8f0; border-radius:3px; overflow:hidden; margin-top:6px; }
  .score-fill { height:100%; background:linear-gradient(90deg,var(--primary),#14b8a6); border-radius:3px; transition:width .4s; }
  .empty { text-align:center; color:var(--muted); padding:30px 10px; font-size:14px; }
  .badge { display:inline-block; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600; }
  .badge-m { background:#dbeafe; color:#1d4ed8; }
  .badge-f { background:#fce7f3; color:#be185d; }
  .badge-o { background:#e2e8f0; color:#475569; }
  .modal-backdrop { position:fixed; inset:0; background:rgba(15,23,42,.45); backdrop-filter:blur(2px); display:none; align-items:center; justify-content:center; z-index:100; }
  .modal-backdrop.open { display:flex; }
  .modal { background:var(--card); border-radius:16px; padding:22px; width:92%; max-width:600px; max-height:90vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.2); }
  .modal h3 { margin:0 0 14px; font-size:18px; }
  .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
  .section-title { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; margin:16px 0 8px; }
  .history-item { border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:8px; }
  .report-card { border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:10px; }
  .lang-select { padding:6px 10px; border-radius:8px; border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.12); color:#fff; font-size:12px; cursor:pointer; }
  .chart-wrap { background:#f8fafc; border:1px solid var(--border); border-radius:10px; padding:10px; }
  .topbar-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  @media (max-width:820px){ .app{grid-template-columns:1fr;} .sidebar{flex-direction:row; flex-wrap:wrap; padding:12px;} .sidebar-foot{display:none;} .nav-btn{flex:1 1 auto;} }

function Chart({ data, label, color }) {
  // data: [{date, value}]
  const pts = data.filter(d => d.value !== null && !isNaN(d.value));
  if (pts.length < 2) return <div className="empty" style={{padding:"12px"}}>Not enough data for {label}.</div>;
  const w = 320, h = 120, pad = 24;
  const vals = pts.map(d => d.value);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max - min) || 1;
  const xStep = (w - 2*pad) / (pts.length - 1);
  const points = pts.map((d,i) => {
    const x = pad + i * xStep;
    const y = h - pad - ((d.value - min) / range) * (h - 2*pad);
    return `${x},${y}`;
  }).join(" ");
  return (
    <div className="chart-wrap">
      <div style={{fontSize:12,fontWeight:600,color:"var(--muted)",marginBottom:4}}>{label}</div>
      <svg width="100%" viewBox={`0 0 ${w} ${h}`} style={{maxWidth:w}}>
        <polyline points={points} fill="none" stroke={color} strokeWidth="2" />
        {pts.map((d,i) => {
          const x = pad + i * xStep;
          const y = h - pad - ((d.value - min) / range) * (h - 2*pad);
          return <circle key={i} cx={x} cy={y} r="3" fill={color} />;
        })}
        <text x={pad} y={h-4} fontSize="9" fill="#64748b">{pts[0].date}</text>
        <text x={w-pad} y={h-4} fontSize="9" fill="#64748b" textAnchor="end">{pts[pts.length-1].date}</text>
      </svg>
      <div style={{fontSize:11,color:"var(--muted)"}}>min {min} · max {max} · latest {pts[pts.length-1].value}</div>
    </div>
  );
}

      setReportForm({ pid:"", date:"", name:"", result:"", notes:"", file:null });

    if (reportForm.file) {

      reader.onload = e => finish(e.target.result, reportForm.file.type, reportForm.file.name);

                  <div className="card">
                    <div className="card-head"><h3>{t("consult",lang)} ({consults.length})</h3></div>
                    {consults.length === 0 ? <div className="empty">{t("noData",lang)}</div> :
                      consults.map(c => (
                        <div className="history-item" key={c.id}>
                          <b>{c.date}</b> — {c.diagnosis}<br/>
                          <span style={{fontSize:13}}>{t("symptoms",lang)}: {(c.symptoms||[]).join(", ")}</span><br/>
                          <span style={{fontSize:13}}>Vitals: BP {c.vitals.bp||"-"} | Pulse {c.vitals.pulse||"-"} | Temp {c.vitals.temp||"-"} | SpO2 {c.vitals.spo2||"-"} | Wt {c.vitals.weight||"-"} | Sugar {c.vitals.sugar||"-"}</span><br/>
                          <span style={{fontSize:13}}>Rx: {(c.meds||[]).map(m=>m[0]).join(", ") || "-"}</span><br/>
                          <span style={{fontSize:13}}>{t("advice",lang)}: {c.advice||"-"}</span>
                        </div>
                      ))}
                  </div>
                  <div className="card">
                    <div className="card-head"><h3>{t("reports",lang)}</h3></div>
                    {reports.length === 0 ? <div className="empty">{t("noData",lang)}</div> :
                      reports.map(r => (
                        <div className="history-item" key={r.id}>
                          <b>{r.name}</b> ({r.date}) — {r.result||"-"}
                          {r.fileData && <span> <a href={r.fileData} target="_blank">📎</a></span>}
                        </div>
                      ))}
                  </div>
                  <div className="card">
                    <div className="card-head"><h3>{t("clinicalHistory",lang)}</h3></div>
                    {(p.clinical||[]).length === 0 ? <div className="empty">{t("noData",lang)}</div> :
                      (p.clinical||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)).map(e => (
                        <div className="history-item" key={e.id}>
                          <b>{e.date}</b> — {e.diagnosis}<br/>
                          <span style={{fontSize:13}}>{e.complaint}</span><br/>
                          <span style={{fontSize:13,color:"var(--muted)"}}>{e.treatment}</span>
                        </div>
                      ))}
                  </div>
                  <div className="card">
                    <div className="card-head"><h3>{t("trend",lang)}</h3></div>
                    <div className="grid grid-3">
                      <Chart data={bpTrend} label={t("systolic",lang)} color="#0f766e" />
                      <Chart data={sugarTrend} label={t("sugar",lang)} color="#2563eb" />
                      <Chart data={weightTrend} label={t("weight",lang)} color="#d97706" />
                    </div>
                  </div>
                </>
              );
            })()}
          </>
        )}

        {view === "reports" && (
          <>
            <div className="page-head">
              <div><h2>{t("reports",lang)}</h2><p></p></div>
              <button className="btn btn-primary" onClick={() => { setReportForm({ pid: selectedId || "", date: new Date().toISOString().slice(0,10), name:"", result:"", notes:"", file:null }); setReportModal(true); }}>{t("addReport",lang)}</button>
            </div>
            <div className="card">
              <Field label={t("selectPatient",lang)}>
                <select value={selectedId} onChange={e => setSelectedId(e.target.value)}>
                  <option value="">-- {t("selectPatient",lang)} --</option>
                  {patients.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                </select>
              </Field>
            </div>
            {!selectedPatient ? <div className="card empty">{t("selectPatient",lang)}</div> :
              (selectedPatient.reports||[]).length === 0 ? <div className="card empty">{t("noData",lang)}</div> :
              (selectedPatient.reports||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)).map(r => (
                <div className="report-card" key={r.id}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <h3 style={{margin:0,fontSize:15}}>{r.name} <span style={{fontSize:12,color:"var(--muted)",fontWeight:400}}>{r.date}</span></h3>
                    <button className="btn btn-danger btn-sm" onClick={() => deleteReport(selectedId, r.id)}>{t("delete",lang)}</button>
                  </div>
                  <div style={{marginTop:8}}><b>{t("result",lang)}:</b> {r.result || "-"}</div>
                  {r.notes && <div><b>{t("reportNotes",lang)}:</b> {r.notes}</div>}
                  {r.fileData && <div style={{marginTop:8}}><a href={r.fileData} target="_blank" download={r.fileName||"report"}>📎 {r.fileName || "View file"}</a></div>}
                </div>
              ))}
          </>
        )}

        {view === "settings" && (
          <>
            <div className="page-head"><div><h2>{t("settings",lang)}</h2><p></p></div></div>
            <div className="card">
              <div className="card-head"><h3>{t("backup",lang)}</h3></div>
              <button className="btn btn-primary" onClick={exportData}>{t("backup",lang)}</button>
              <button className="btn btn-outline" style={{marginLeft:8}} onClick={() => fileInputRef.current && fileInputRef.current.click()}>{t("restore",lang)}</button>
              <input ref={fileInputRef} type="file" accept="application/json" style={{display:"none"}} onChange={importData} />
              <div style={{marginTop:10,fontSize:12,color:"var(--muted)"}}>Export all patient data to JSON for backup. Restore from a previously exported file.</div>
            </div>
            <div className="card">
              <div className="card-head"><h3>{t("language",lang)}</h3></div>
              <select value={lang} onChange={e => setLang(e.target.value)} style={{padding:"9px 12px",border:"1px solid var(--border)",borderRadius:10}}>
                <option value="en">English</option>
                <option value="hi">हिन्दी (Hindi)</option>
                <option value="bn">বাংলা (Bangla)</option>
              </select>
            </div>
            <div className="card">
              <div className="card-head"><h3>Install as App (PWA)</h3></div>
              <div style={{fontSize:13,color:"var(--muted)"}}>Use browser menu → "Install ASHVIK" or "Add to Home Screen" for offline use.</div>
            </div>
          </>
        )}
      </main>

      {/* Patient Modal */}
      <div className={"modal-backdrop" + (patientModal ? " open" : "")} onClick={() => setPatientModal(false)}>
        <div className="modal" onClick={e => e.stopPropagation()}>
          <h3>{editingPatientId ? t("edit",lang) : t("addPatient",lang)}</h3>
          <div className="grid grid-2">
            <Field label={t("name",lang) + " *"}><input value={patientForm.name} onChange={e => setPatientForm({...patientForm, name: e.target.value})} /></Field>
            <Field label={t("age",lang) + " *"}><input type="number" min="0" value={patientForm.age} onChange={e => setPatientForm({...patientForm, age: e.target.value})} /></Field>
            <Field label={t("sex",lang) + " *"}>
              <select value={patientForm.sex} onChange={e => setPatientForm({...patientForm, sex: e.target.value})}>
                <option>Male</option><option>Female</option><option>Other</option>
              </select>
            </Field>
            <Field label={t("dob",lang)}><input type="date" value={patientForm.dob} onChange={e => setPatientForm({...patientForm, dob: e.target.value})} /></Field>
            <Field label={t("phone",lang)}><input value={patientForm.phone} onChange={e => setPatientForm({...patientForm, phone: e.target.value})} /></Field>
            <Field label={t("bloodGroup",lang)}><input value={patientForm.bloodGroup} onChange={e => setPatientForm({...patientForm, bloodGroup: e.target.value})} /></Field>
          </div>
          <Field label={t("address",lang)} style={{marginTop:10}}><textarea value={patientForm.address} onChange={e => setPatientForm({...patientForm, address: e.target.value})} /></Field>
          <Field label={t("allergies",lang)} style={{marginTop:10}}><input value={patientForm.allergies} onChange={e => setPatientForm({...patientForm, allergies: e.target.value})} /></Field>
          <Field label={t("chronic",lang)} style={{marginTop:10}}><input value={patientForm.chronic} onChange={e => setPatientForm({...patientForm, chronic: e.target.value})} /></Field>
          <Field label={t("notes",lang)} style={{marginTop:10}}><textarea value={patientForm.notes} onChange={e => setPatientForm({...patientForm, notes: e.target.value})} /></Field>
          <div className="modal-actions">
            <button className="btn btn-outline" onClick={() => setPatientModal(false)}>{t("cancel",lang)}</button>
            <button className="btn btn-primary" onClick={savePatient}>{t("save",lang)}</button>
          </div>
        </div>
      </div>

      {/* Report Modal */}
      <div className={"modal-backdrop" + (reportModal ? " open" : "")} onClick={() => setReportModal(false)}>
        <div className="modal" onClick={e => e.stopPropagation()}>
          <h3>{t("addReport",lang)}</h3>
          <Field label={t("selectPatient",lang) + " *"}>
            <select value={reportForm.pid} onChange={e => setReportForm({...reportForm, pid: e.target.value})}>
              <option value="">-- {t("selectPatient",lang)} --</option>
              {patients.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </Field>
          <Field label={t("date",lang) + " *"}><input type="date" value={reportForm.date} onChange={e => setReportForm({...reportForm, date: e.target.value})} /></Field>
          <Field label={t("reportName",lang) + " *"}><input placeholder="CBC, Malaria RDT, CXR..." value={reportForm.name} onChange={e => setReportForm({...reportForm, name: e.target.value})} /></Field>
          <Field label={t("reportResult",lang)}><textarea value={reportForm.result} onChange={e => setReportForm({...reportForm, result: e.target.value})} /></Field>
          <Field label={t("reportNotes",lang)}><textarea value={reportForm.notes} onChange={e => setReportForm({...reportForm, notes: e.target.value})} /></Field>
          <Field label={t("attachFile",lang)}><input type="file" onChange={e => setReportForm({...reportForm, file: e.target.files[0]})} /></Field>
          <div className="modal-actions">
            <button className="btn btn-outline" onClick={() => setReportModal(false)}>{t("cancel",lang)}</button>
            <button className="btn btn-primary" onClick={saveReport}>{t("save",lang)}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

// Register service worker for PWA offline
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
