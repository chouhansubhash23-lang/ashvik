<style>

  * { box-sizing: border-box; }

  .brand { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .brand-logo { width:40px; height:40px; border-radius:12px; background:rgba(255,255,255,.18); display:grid; place-items:center; font-weight:700; font-size:19px; }
  .brand h1 { font-size:18px; margin:0; font-weight:700; }
  .brand p { font-size:11px; margin:0; opacity:.75; }
  .nav-btn { display:flex; align-items:center; gap:10px; padding:10px 13px; border:none; background:transparent; color:rgba(255,255,255,.85); border-radius:10px; cursor:pointer; font-size:13.5px; font-weight:500; text-align:left; transition:background .15s,color .15s; width:100%; }
  .nav-btn:hover { background:rgba(255,255,255,.12); color:#fff; }
  .nav-btn.active { background:#fff; color:var(--primary-dark); font-weight:600; }
  .sidebar-foot { margin-top:auto; font-size:11px; opacity:.6; padding-top:12px; border-top:1px solid rgba(255,255,255,.15); }
  .main { padding:24px 28px; overflow-y:auto; height:100vh; }
  .page-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:12px; }
  .page-head h2 { margin:0; font-size:23px; font-weight:700; letter-spacing:-.3px; }
  .page-head p { margin:4px 0 0; color:var(--muted); font-size:13px; }
  .btn { padding:9px 16px; border:none; border-radius:10px; cursor:pointer; font-size:14px; font-weight:600; transition:transform .05s, box-shadow .15s; }
  .btn:active { transform:translateY(1px); }
  .btn-primary { background:var(--primary); color:#fff; box-shadow:0 4px 12px rgba(13,148,136,.25); }
  .btn-primary:hover { background:var(--primary-dark); }
  .btn-outline { background:#fff; border:1px solid var(--border); color:var(--text); }
  .btn-outline:hover { border-color:var(--primary); color:var(--primary); }
  .btn-danger { background:var(--danger); color:#fff; }
  .btn-warn { background:var(--warn); color:#fff; }
  .btn-sm { padding:6px 12px; font-size:12px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; margin-bottom:16px; box-shadow:0 1px 3px rgba(15,23,42,.04); }
  .card-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:8px; flex-wrap:wrap; }
  .card-head h3 { margin:0; font-size:16px; font-weight:600; }
  .card-head .sub { font-size:12px; color:var(--muted); }
  .chat { display:flex; flex-direction:column; gap:10px; max-height:460px; overflow:auto; padding:4px 2px; }
  .msg { max-width:82%; padding:10px 14px; border-radius:14px; font-size:14px; line-height:1.45; white-space:pre-wrap; }
  .msg.ashvik { background:#f0fdfa; border:1px solid #99f6e4; align-self:flex-start; border-bottom-left-radius:4px; }
  .msg.doctor { background:var(--primary); color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }
  .msg .who { font-size:10px; text-transform:uppercase; letter-spacing:.5px; opacity:.65; margin-bottom:3px; }
  .dm-plan { border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-top:10px; }
  .dm-plan h4 { margin:0 0 6px; font-size:14px; }
  .grid { display:grid; gap:12px; }
  .grid-2 { grid-template-columns:repeat(2,1fr); }
  .grid-3 { grid-template-columns:repeat(3,1fr); }
  .grid-4 { grid-template-columns:repeat(4,1fr); }
  @media (max-width:900px){ .grid-3,.grid-4{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:600px){ .grid-2,.grid-3,.grid-4{grid-template-columns:1fr;} }
  .field { display:flex; flex-direction:column; gap:4px; }
  .field label { font-size:12px; font-weight:500; color:var(--muted); }
  .field input, .field select, .field textarea { width:100%; padding:9px 12px; border:1px solid var(--border); border-radius:10px; font-size:14px; font-family:inherit; background:#fff; transition:border-color .15s, box-shadow .15s; }
  .field input:focus, .field select:focus, .field textarea:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-light); }
  .field textarea { min-height:60px; resize:vertical; }
  .field input[readonly] { background:#f1f5f9; color:var(--muted); }
  .chip { display:inline-flex; align-items:center; padding:6px 12px; border-radius:999px; font-size:12.5px; font-weight:500; border:1px solid var(--border); background:#fff; cursor:pointer; margin:3px; transition:all .15s; user-select:none; }
  .chip:hover { border-color:var(--primary); color:var(--primary); }
  .chip.active { background:var(--primary); color:#fff; border-color:var(--primary); }
  .alert { padding:12px 14px; border-radius:10px; font-size:13px; margin-bottom:12px; border:1px solid; }
  .alert-info { background:#eff6ff; color:#1e40af; border-color:#bfdbfe; }
  .alert-warn { background:#fffbeb; color:#92400e; border-color:#fde68a; }
  .alert-danger { background:#fef2f2; color:#991b1b; border-color:#fecaca; }
  .alert-success { background:#f0fdf4; color:#166534; border-color:#bbf7d0; }
  .alert ul { margin:6px 0 0 18px; padding:0; }
  .result-item { border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .score-bar { height:6px; background:#e2e8f0; border-radius:3px; overflow:hidden; margin-top:6px; }
  .score-fill { height:100%; background:linear-gradient(90deg,var(--primary),#14b8a6); border-radius:3px; transition:width .4s; }
  .empty { text-align:center; color:var(--muted); padding:30px 10px; font-size:14px; }
  .badge { display:inline-block; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600; }
  .badge-m { background:#dbeafe; color:#1d4ed8; }
  .badge-f { background:#fce7f3; color:#be185d; }
  .badge-o { background:#e2e8f0; color:#475569; }
  .modal-backdrop { position:fixed; inset:0; background:rgba(15,23,42,.45); backdrop-filter:blur(2px); display:none; align-items:center; justify-content:center; z-index:100; }
  .modal-backdrop.open { display:flex; }
  .modal { background:var(--card); border-radius:16px; padding:22px; width:92%; max-width:600px; max-height:90vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.2); }
  .modal h3 { margin:0 0 14px; font-size:18px; }
  .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
  .section-title { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; margin:16px 0 8px; }
  .history-item { border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:8px; }
  .report-card { border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:10px; }
  .ocr-panel { background:#f8fafc; border:1px dashed var(--border); border-radius:10px; padding:10px; margin-top:10px; }
  .lang-select { padding:6px 10px; border-radius:8px; border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.12); color:#fff; font-size:12px; cursor:pointer; }
  .chart-wrap { background:#f8fafc; border:1px solid var(--border); border-radius:10px; padding:10px; }
  .topbar-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  @media (max-width:600px){
    .app{grid-template-columns:1fr; grid-template-rows:auto 1fr; height:100vh; overflow:hidden;}
    .sidebar{flex-direction:row; flex-wrap:wrap; padding:8px; height:auto; max-height:38vh; overflow-y:auto;}
    .sidebar-foot{display:none;}
    .nav-btn{flex:1 1 auto; padding:7px 10px; font-size:12px;}
    .main{height:auto; min-height:0; padding:14px 16px;}
  }

// ---- Offline report reader (Tesseract.js + pdf.js) ----
const TESSERACT_CDN = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
const PDFJS_CDN = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js";
const PDFJS_WORKER = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";

const _scriptCache = {};
function loadScript(src) {
  if (_scriptCache[src]) return _scriptCache[src];
  _scriptCache[src] = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src;
    s.async = true;
    s.onload = () => resolve();
    s.onerror = () => { delete _scriptCache[src]; reject(new Error("Library load nahi hui: " + src)); };
    document.head.appendChild(s);
  });
  return _scriptCache[src];
}

let _ocrWorkerPromise = null;
let _ocrProgress = null;
async function getOcrWorker() {
  if (!_ocrWorkerPromise) {
    await loadScript(TESSERACT_CDN);
    if (!window.Tesseract) throw new Error("OCR engine load nahi hua.");
    _ocrWorkerPromise = window.Tesseract.createWorker("eng", 1, {
      logger: m => { if (_ocrProgress) _ocrProgress(m); }
    }).catch(err => { _ocrWorkerPromise = null; throw err; });
  }
  return _ocrWorkerPromise;
}

async function ocrImageFile(file) {
  const worker = await getOcrWorker();
  const { data } = await worker.recognize(file);
  return (data.text || "").trim();
}

async function extractPdfText(file, onPage) {
  await loadScript(PDFJS_CDN);
  const pdfjsLib = window.pdfjsLib;
  if (!pdfjsLib) throw new Error("PDF engine load nahi hua.");
  pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
  const data = new Uint8Array(await file.arrayBuffer());
  const pdf = await pdfjsLib.getDocument({ data }).promise;
  const total = Math.min(pdf.numPages, 5);
  let out = "";
  for (let i = 1; i <= total; i++) {
    if (onPage) onPage(i, total);
    const page = await pdf.getPage(i);
    let pageText = "";
    try {
      const content = await page.getTextContent();
      const items = (content.items || []).filter(it => it.str && it.str.trim());
      const rows = new Map();
      items.forEach(it => {
        const y = Math.round((it.transform?.[5] || 0) * 2) / 2;
        if (!rows.has(y)) rows.set(y, []);
        rows.get(y).push({ x: it.transform?.[4] || 0, str: it.str });
      });
      pageText = [...rows.entries()]
        .sort((a, b) => b[0] - a[0])
        .map(([, arr]) => arr.sort((a, b) => a.x - b.x).map(a => a.str).join(" ").replace(/\s+/g, " ").trim())
        .join("\n")
        .trim();
    } catch (e) {}
    if (pageText.length < 20) {
      const viewport = page.getViewport({ scale: 2 });
      const canvas = document.createElement("canvas");
      canvas.width = Math.ceil(viewport.width);
      canvas.height = Math.ceil(viewport.height);
      const ctx = canvas.getContext("2d");
      await page.render({ canvasContext: ctx, viewport }).promise;
      const blob = await new Promise(res => canvas.toBlob(res, "image/png"));
      if (blob) {
        const worker = await getOcrWorker();
        const { data: ocr } = await worker.recognize(blob);
        pageText = (ocr.text || "").trim();
      }
    }
    out += pageText + "\n";
  }
  if (pdf.numPages > 5) out += `\n[Only first 5 pages read out of ${pdf.numPages}]`;
  return out.trim();
}

function aliasHit(line, alias) {
  const a = String(alias).toLowerCase();
  if (a.length <= 3 || /[+^]/.test(a)) {
    const esc = a.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    return new RegExp("(^|[^a-z0-9])" + esc + "([^a-z0-9]|$)", "i").test(line);
  }
  return String(line).toLowerCase().includes(a);
}

const LAB_TEST_BY_NAME = Object.fromEntries(LAB_TESTS.map(t => [t.name, t]));

function labRangeFor(name, sex) {
  const test = LAB_TEST_BY_NAME[name];
  if (!test) return null;
  const female = sex === "Female";
  const low = female && test.femaleLow != null ? test.femaleLow : test.maleLow != null ? test.maleLow : test.low;
  const high = female && test.femaleHigh != null ? test.femaleHigh : test.maleHigh != null ? test.maleHigh : test.high;
  return { low: low != null ? low : null, high: high != null ? high : null, unit:test.unit || "" };
}

function labRefText(name, sex) {
  if (/^Widal/.test(name)) return "O ≥1:200 positive; 1:125–199 borderline";
  if (/^(Dengue |Malaria |Typhoid |HBsAg|Anti-HCV|HIV|VDRL|Urine (Protein|Glucose|Ketones|Blood|Nitrite|Leukocyte Esterase|Bilirubin)|Urobilinogen|Stool )/.test(name)) return "Expected negative/non-reactive";
  const r = labRangeFor(name, sex);
  if (!r) return "";
  if (r.low === 0 && r.high != null) return "< " + r.high + (r.unit ? " " + r.unit : "");
  if (r.low != null && r.high == null) return "> " + r.low + (r.unit ? " " + r.unit : "");
  if (r.low != null && r.high != null) return r.low + "–" + r.high + (r.unit ? " " + r.unit : "");
  return "";
}

function getLabFlag(name, value, sex) {
  let n = parseFloat(String(value).replace(",", "."));
  if (isNaN(n)) return "";
  // Reports may print WBC as 8.5 (x10^3/µL) or 8500 (/µL), and platelets
  // as 2.1 (lakh/µL), 210 (x10^3/µL) or 210000 (/µL).
  if (name === "WBC" && n < 100) n *= 1000;
  if (name === "Platelets") {
    if (n < 10) n *= 100000;
    else if (n < 1000) n *= 1000;
  }
  const r = labRangeFor(name, sex);
  if (!r) return "";
  if (r.low != null && n < r.low) return "Low";
  if (r.high != null && n > r.high) return "High";
  return "";
}

function unitFor(test, line) {
  const l = line.toLowerCase();
  if (test.name === "Platelets" || test.name === "WBC") {
    if (/lakh|lac/.test(l)) return "lakh/µL";
    if (/10\s*\^?\s*3|x10/.test(l)) return "x10³/µL";
  }
  return test.unit;
}

function parseLabNumber(raw) {
  let s = String(raw || "").trim();
  if (!s) return NaN;
  // Indian reports use 12,500 or 1,25,000 for thousands and 0,5 for decimals.
  if (/^\d{1,3}(?:,\d{2})*,\d{3}$/.test(s) || /^\d{1,3}(?:,\d{3})+$/.test(s)) {
    return parseFloat(s.replace(/,/g, ""));
  }
  if (/^\d+,\d{1,2}$/.test(s)) return parseFloat(s.replace(",", "."));
  return parseFloat(s.replace(/,/g, ""));
}

function parseLabValues(text, sex) {
  const lines = String(text || "").split(/\r?\n/).map(l => l.replace(/\s+/g, " ").trim()).filter(Boolean);
  // Track the current report section so a urine "RBC 2 /HPF" is not mistaken
  // for a blood RBC count, and a blood "WBC 8500" is not mistaken for urine WBC.
  const sections = [];
  let section = "";
  lines.forEach(line => {
    const l = line.toLowerCase();
    if (/urine|urinalysis|routine examination/.test(l)) section = "urine";
    else if (/stool|faeces|feces/.test(l)) section = "stool";
    else if (/\bcbc\b|complete blood|hemogram|lipid profile|liver function|kidney function|thyroid profile|blood sugar|diabetes profile/.test(l)) section = "blood";
    sections.push(section);
  });
  const found = [];
  for (const test of LAB_TESTS) {
    for (let li = 0; li < lines.length; li++) {
      const line = lines[li];
      const lower = line.toLowerCase();
      const urineLine = sections[li] === "urine" || /urine|urinary|\bhpf\b|per hpf/.test(lower);
      if (test.category === "Urine" && !urineLine) continue;
      if ((test.name === "RBC" || test.name === "WBC") && urineLine) continue;
      // Do not read a urine dipstick line as a serum value (e.g. "Sugar 2+"
      // or "Urine creatinine 100") unless the line explicitly says serum/plasma.
      const bloodTest = !["Urine", "Stool"].includes(test.category);
      const serumMarker = /serum|plasma|\bcbc\b|hemoglobin|haemoglobin|platelet|hematocrit|haematocrit|total leukocyte|rbc count|wbc count|blood\s+(?:urea|creatinine|sugar|glucose|count)/.test(lower);
      if (bloodTest && urineLine && !serumMarker) continue;
      if (test.skip && test.skip.test(lower)) continue;
      const aliases = test.aliases.slice().sort((a, b) => b.length - a.length);
      const hit = aliases.find(a => aliasHit(line, a));
      if (!hit) continue;
      const idx = lower.indexOf(hit.toLowerCase());
      const tail = idx >= 0 ? line.slice(idx + hit.length) : line;
      const m = tail.match(/(\d+(?:[.,]\d+)*)/) || line.match(/(\d+(?:[.,]\d+)*)/);
      if (!m) continue;
      const num = parseLabNumber(m[1]);
      const value = isNaN(num) ? m[1].replace(/,/g, ".") : String(num);
      found.push({ name:test.name, value, unit:unitFor(test, line), flag:getLabFlag(test.name, value, sex), line });
      break;
    }
  }
  return found;
}

function parseQualitative(text) {
  const lines = String(text || "").split(/\r?\n/).map(l => l.replace(/\s+/g, " ").trim()).filter(Boolean);
  const sections = [];
  let section = "";
  lines.forEach(line => {
    const l = line.toLowerCase();
    if (/urine|urinalysis|routine examination/.test(l)) section = "urine";
    else if (/stool|faeces|feces/.test(l)) section = "stool";
    else if (/\bcbc\b|complete blood|hemogram|blood group|blood sugar|lipid profile|liver function|kidney function|thyroid profile/.test(l)) section = "blood";
    sections.push(section);
  });
  const found = [];
  for (const test of QUAL_TESTS) {
    for (let li = 0; li < lines.length; li++) {
      const line = lines[li];
      const lower = line.toLowerCase();
      const urineLine = sections[li] === "urine" || /urine|urinary/.test(lower);
      const stoolLine = sections[li] === "stool" || /stool|faeces|feces/.test(lower);
      if (test.name.startsWith("Urine ") && !urineLine) continue;
      if (test.name.startsWith("Stool ") && !stoolLine) continue;
      if (!test.aliases.some(a => aliasHit(line, a))) continue;
      let value = "";
      if (test.positive.test(line)) value = "Positive";
      else if (test.negative.test(line)) value = "Negative";
      if (value) {
        found.push({ name:test.name, value, unit:"", flag:value === "Positive" ? "Positive" : "", line });
        break;
      }
    }
  }
  return found;
}

// Widal is semi-quantitative (1:80, 1:160, 1:250...). OCR often misreads
// "1:250" as "1.250", so parse titres separately instead of as plain numbers.
function parseWidal(text) {
  const raw = String(text || "");
  const start = raw.search(/WIDAL\s*(?:TEST)?/i);
  if (start < 0) return [];
  let section = raw.slice(start);
  const end = section.search(/Interpretation\s+of\s+Test|INTERPRETATION\s+OF\s+TEST/i);
  if (end >= 0) section = section.slice(0, end);
  if (!/typhi|para\s*typhi/i.test(section)) return [];
  const lines = section.split(/\r?\n/).map(l => l.replace(/\s+/g, " ").trim()).filter(Boolean);
  const titres = [];
  lines.forEach((line) => {
    const re = /\b1\s*[:：.,\-/]\s*(\d{1,4})\b/g;
    let m;
    while ((m = re.exec(line))) {
      const n = parseInt(m[1], 10);
      if (n >= 20 && n <= 10240) titres.push({ n, line });
    }
  });
  if (!titres.length) return [];
  const defs = [
    { name:"Widal Typhi O", re:/typhi\s*['"‘’]?\s*o\b/i },
    { name:"Widal Typhi H", re:/typhi\s*['"‘’]?\s*h\b/i },
    { name:"Widal Para A H", re:/para\s*a\s*['"‘’]?\s*h\b/i },
    { name:"Widal Para B H", re:/para\s*b\s*['"‘’]?\s*h\b/i }
  ];
  const used = new Set();
  const out = [];
  defs.forEach((d) => {
    let t = titres.find(x => !used.has(x) && d.re.test(x.line));
    if (!t) t = titres.find(x => !used.has(x));
    if (!t) return;
    used.add(t);
    const flag = t.n >= 200 ? "Positive" : t.n >= 125 ? "Borderline" : "Negative";
    out.push({ name:d.name, value:"1:" + t.n, unit:"titre", flag, line:t.line });
  });
  return out;
}

// Shared clinical reasoning engine used by Quick Differential and ASHVIK Doctor.
function labValueText(v) {
  if (!v) return "";
  const raw = String(v.value ?? "");
  const unit = v.unit && !raw.includes(v.unit) && !raw.includes("/") && !raw.includes("%") ? " " + v.unit : "";
  return raw + unit;
}

function getReportLabs(report) {
  const vals = Array.isArray(report?.ocrValues) ? report.ocrValues.slice() : [];
  // Existing reports may have OCR text but no parsed values (older version).
  // Recover Widal titres on the fly so the doctor does not have to re-upload.
  parseWidal(report?.ocrText).forEach(v => {
    if (!vals.some(x => x && x.name === v.name)) vals.push(v);
  });
  return vals;
}

function getLatestReportLabs(patient) {
  const reports = (patient?.reports || [])
    .map(r => ({ ...r, _labs: getReportLabs(r) }))
    .filter(r => r._labs.length)
    .sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
  const map = new Map();
  reports.forEach(r => r._labs.forEach(v => {
    if (v && v.name && !map.has(v.name)) map.set(v.name, { ...v, reportDate: r.date, reportName: r.name });
  }));
  return { values: [...map.values()], count: reports.length, date: reports[0]?.date || "", name: reports[0]?.name || "" };
}

function drugKey(name) {
  const m = String(name || "").toLowerCase().match(/[a-z]+/);
  return m ? m[0] : "";
}

function mergeMeds(base, extra) {
  const out = [];
  [...(base || []), ...(extra || [])].forEach(m => {
    if (!m || !m[0]) return;
    const k = drugKey(m[0]);
    if (!out.some(x => drugKey(x[0]) === k)) out.push(m);
  });
  return out;
}

function extraMeds(base, extra) {
  const keys = new Set((base || []).map(m => drugKey(m[0])));
  return (extra || []).filter(m => m && m[0] && !keys.has(drugKey(m[0])));
}

// Symptom-based treatment added to every case, in addition to disease-specific Rx.
function buildSymptomaticMeds({ age, symptoms, notes, vitals }) {
  const text = ((symptoms || []).join(" ") + " " + (notes || "")).toLowerCase();
  const temp = parseFloat(vitals?.temp);
  const ageNum = Number(age) || 0;
  const meds = [];
  const add = (m) => {
    if (!meds.some(x => drugKey(x[0]) === drugKey(m[0]))) meds.push(m);
  };

  const fever = (!isNaN(temp) && temp >= 100.4) || /fever|body ache|headache|joint pain|chills/i.test(text);
  if (fever) add(["Paracetamol 500mg", "1 tab", "TDS", "3 days", "After food; max 3 g/day"]);

  const loose = /diarrh|loose motion|loose stool|watery stool|dast|दस्त/i.test(text);
  if (loose) {
    add(["ORS", "1 sachet", "After each loose stool", "3 days", "Dissolve 1 sachet in 1 litre clean water"]);
    if (ageNum >= 12) add(["Racecadotril 100mg", "1 cap", "TDS", "3 days", "After food; avoid if bloody diarrhoea; continue ORS"]);
    else if (ageNum > 0 && ageNum < 5) add(["Zinc 20mg", "1 tab", "OD", "14 days", "Children under 5; continue ORS"]);
  }

  const cold = /cold|runny nose|sneez|nasal|naak|जुकाम/i.test(text);
  if (cold) {
    if (ageNum >= 12) add(["Cetirizine 10mg", "1 tab", "OD", "5 days", "At night; may cause drowsiness"]);
    else if (ageNum >= 6) add(["Cetirizine 5mg", "1 tab", "OD", "5 days", "At night; may cause drowsiness"]);
    add(["Saline nasal drops", "2 drops each nostril", "TDS", "5 days", "Steam inhalation; avoid decongestant overuse"]);
  }

  const vomit = /vomit|vomiting|nausea|dehydrat/i.test(text);
  if (vomit) add(["ORS", "1 sachet", "Sips frequently", "3 days", "Small frequent sips; seek help if unable to drink"]);

  const throat = /sore throat|throat pain/i.test(text);
  if (throat) add(["Warm saline gargle", "—", "TDS", "3 days", "Not for young children"]);

  return meds;
}

function buildSymptomaticAdvice({ symptoms, notes, vitals }) {
  const text = ((symptoms || []).join(" ") + " " + (notes || "")).toLowerCase();
  const temp = parseFloat(vitals?.temp);
  const out = [];
  if ((!isNaN(temp) && temp >= 100.4) || /fever|body ache|headache|joint pain|chills/i.test(text)) {
    out.push("Fever: paracetamol, fluids, rest; review if fever persists >3 days or worsens.");
  }
  if (/diarrh|loose motion|loose stool|watery stool|dast|दस्त/i.test(text)) {
    out.push("Loose motion: ORS after each stool, continue food; avoid loperamide if fever or blood in stool.");
  }
  if (/cold|runny nose|sneez|nasal|naak|जुकाम/i.test(text)) {
    out.push("Cold: steam inhalation, saline nasal drops, warm fluids; cetirizine may cause drowsiness.");
  }
  if (/vomit|vomiting|nausea|dehydrat/i.test(text)) {
    out.push("Vomiting: small frequent ORS sips; seek care if unable to drink or urine output falls.");
  }
  if (/sore throat|throat pain/i.test(text)) {
    out.push("Sore throat: warm saline gargle and warm fluids.");
  }
  return out;
}

function assessCase({ age, sex, symptoms, notes, vitals, chronic, labs }) {
  const symptomText = ((symptoms || []).join(" ") + " " + (notes || "")).toLowerCase();
  const chronicL = String(chronic || "").toLowerCase();
  const temp = parseFloat(vitals?.temp);
  const spo2 = parseFloat(vitals?.spo2);
  const sugar = parseFloat(vitals?.sugar);
  const ageNum = Number(age) || 0;

  // Report / lab values (from OCR) are used as additional clinical evidence.
  const lab = {};
  (labs || []).forEach(v => { if (v && v.name) lab[v.name] = v; });
  const labNum = (name) => {
    const v = lab[name];
    if (!v) return NaN;
    return parseFloat(String(v.value).replace(",", "."));
  };
  const labPos = (name) => {
    const v = lab[name];
    return !!(v && /positive|reactive|detected/i.test(String(v.value)));
  };
  const hb = labNum("Hemoglobin");
  const hba1c = labNum("HbA1c");
  const fbs = labNum("Fasting Blood Sugar");
  const ppbs = labNum("Postprandial Blood Sugar");
  const rbs = labNum("Random Blood Sugar");
  const bs = labNum("Blood Sugar");
  const ferritin = labNum("Ferritin");
  const plateletRaw = labNum("Platelets");
  const plateletAbs = isNaN(plateletRaw) ? NaN : plateletRaw < 10 ? plateletRaw * 100000 : plateletRaw < 1000 ? plateletRaw * 1000 : plateletRaw;
  const wbcRaw = labNum("WBC");
  const wbcAbs = isNaN(wbcRaw) ? NaN : wbcRaw < 100 ? wbcRaw * 1000 : wbcRaw;
  const tsh = labNum("TSH");
  const ft4 = labNum("FT4");
  const esr = labNum("ESR");
  const crp = labNum("CRP");
  const creat = labNum("Creatinine");
  const sodium = labNum("Sodium");
  const potassium = labNum("Potassium");
  const alt = labNum("SGPT/ALT");
  const ast = labNum("SGOT/AST");
  const altHigh = sex === "Female" ? 35 : 40;
  const creatHigh = sex === "Female" ? 1.1 : 1.3;
  const bilirubin = labNum("Total Bilirubin");
  const inr = labNum("INR");
  const egfr = labNum("eGFR");
  const troponin = labNum("Troponin I");
  const dDimer = labNum("D-Dimer");
  const procalc = labNum("Procalcitonin");
  const urineWbc = labNum("Urine WBC");
  const labTitre = (name) => {
    const v = lab[name];
    if (!v) return NaN;
    const m = String(v.value).match(/(\d{1,4})\s*(?:titre)?\s*$/i);
    return m ? parseInt(m[1], 10) : NaN;
  };
  const widalO = labTitre("Widal Typhi O");
  const widalH = labTitre("Widal Typhi H");
  const widalAH = labTitre("Widal Para A H");
  const widalBH = labTitre("Widal Para B H");
  const sugarValues = [fbs, ppbs, rbs, bs].filter(n => !isNaN(n));
  const highSugar = sugarValues.length ? Math.max(...sugarValues) : NaN;

  const scored = CONDITIONS.map(cond => {
    let score = 0; const matched = [];
    cond.keywords.forEach(kw => { if (symptomText.includes(kw.toLowerCase())) { score += 2; matched.push(kw); } });
    if (chronicL.includes("diabetes") && cond.name === "Type 2 Diabetes") score += 3;
    if (chronicL.includes("hypertension") && cond.name === "Hypertension") score += 3;
    if (chronicL.includes("asthma") && cond.name === "Asthma") score += 3;
    if (chronicL.includes("copd") && cond.name === "COPD") score += 3;
    if (ageNum < 5 && matched.length > 0 && ["Pneumonia", "Acute diarrhoea"].includes(cond.name)) score += 1;
    if (ageNum > 60 && matched.length > 0 && ["Hypertension", "Type 2 Diabetes", "COPD"].includes(cond.name)) score += 1;
    if (sex === "Female" && matched.length > 0 && cond.name === "UTI") score += 1;
    if (!isNaN(temp) && temp >= 100.4 && cond.keywords.includes("fever")) score += 1;
    if (!isNaN(spo2) && spo2 < 94 && ["Pneumonia", "COPD", "Asthma"].includes(cond.name)) score += 3;
    if (!isNaN(sugar) && sugar >= 200 && cond.name === "Type 2 Diabetes") score += 3;

    // Lab-driven scoring
    if (cond.name === "Iron deficiency anaemia") {
      if (!isNaN(hb) && hb < (sex === "Female" ? 12 : 13)) score += 3;
      if (!isNaN(hb) && hb < 9) score += 2;
      if (!isNaN(ferritin) && ferritin < 30) score += 2;
    }
    if (cond.name === "Type 2 Diabetes") {
      if (!isNaN(hba1c) && hba1c >= 6.5) score += 4;
      if (!isNaN(fbs) && fbs >= 126) score += 3;
      if (!isNaN(ppbs) && ppbs >= 200) score += 3;
      if (!isNaN(rbs) && rbs >= 200) score += 3;
      if (!isNaN(bs) && bs >= 200) score += 2;
    }
    if (cond.name === "Dengue") {
      if (!isNaN(plateletAbs) && plateletAbs < 150000) score += 3;
      if (!isNaN(plateletAbs) && plateletAbs < 100000) score += 2;
      if (labPos("Dengue NS1")) score += 6;
      if (labPos("Dengue IgM")) score += 3;
    }
    if (cond.name === "Malaria" && labPos("Malaria Antigen")) score += 6;
    if (cond.name === "Typhoid") {
      if (labPos("Typhoid IgM")) score += 6;
      // Widal: the report itself uses >1:200 as diagnostic, 1:125 needs confirmation.
      if (!isNaN(widalO) && widalO >= 200) score += 8;
      else if (!isNaN(widalO) && widalO >= 125) score += 3;
      if (!isNaN(widalH) && widalH >= 200) score += 4;
      else if (!isNaN(widalH) && widalH >= 125) score += 2;
      if (!isNaN(widalAH) && widalAH >= 200) score += 3;
      if (!isNaN(widalBH) && widalBH >= 200) score += 3;
    }
    if (cond.name === "Hypothyroidism") {
      if (!isNaN(tsh) && tsh > 4.5) score += 4;
      if (!isNaN(ft4) && ft4 < 0.8) score += 2;
    }
    if (cond.name === "Pneumonia" && matched.length > 0) {
      if (!isNaN(wbcAbs) && wbcAbs > 11000) score += 2;
      if (!isNaN(crp) && crp > 10) score += 1;
    }
    if (cond.name === "UTI") {
      if (matched.length > 0 && !isNaN(wbcAbs) && wbcAbs > 11000) score += 1;
      if (labPos("Urine Nitrite")) score += 4;
      if (labPos("Urine Leukocyte Esterase")) score += 3;
      if (!isNaN(urineWbc) && urineWbc > 5) score += 2;
      if (labPos("Urine Blood")) score += 1;
    }
    if (cond.name === "Tuberculosis" && matched.length > 0) {
      if (!isNaN(esr) && esr > 40) score += 2;
      if (!isNaN(crp) && crp > 20) score += 1;
    }
    if (cond.name === "Viral fever" && matched.length > 0 && !isNaN(wbcAbs) && wbcAbs < 4000) score += 1;

    return { ...cond, score, matched, treatment: (DISEASE_TEMPLATES[cond.name] || {}).meds || [], treatmentAdvice: (DISEASE_TEMPLATES[cond.name] || {}).advice || cond.advice };
  }).filter(c => c.score > 0).sort((a, b) => b.score - a.score);
  const top = scored.slice(0, 5);
  const suggested = top.length ? top[0].name : "Insufficient data — needs clinical evaluation";

  const labFindings = [];
  const seenLab = new Set();
  const addLab = (name, text) => {
    if (!lab[name] || seenLab.has(name)) return;
    const v = lab[name];
    labFindings.push(`${name}: ${labValueText(v)} — ${text}`);
    seenLab.add(name);
  };
  if (!isNaN(hb) && hb < (sex === "Female" ? 12 : 13)) addLab("Hemoglobin", "low (anaemia)");
  if (!isNaN(hba1c) && hba1c >= 6.5) addLab("HbA1c", "high (diabetes range)");
  if (!isNaN(fbs) && fbs >= 126) addLab("Fasting Blood Sugar", "high (diabetes range)");
  if (!isNaN(ppbs) && ppbs >= 200) addLab("Postprandial Blood Sugar", "high (diabetes range)");
  if (!isNaN(rbs) && rbs >= 200) addLab("Random Blood Sugar", "high (diabetes range)");
  if (!isNaN(bs) && bs >= 200) addLab("Blood Sugar", "high (diabetes range)");
  if (!isNaN(plateletAbs) && plateletAbs < 150000) addLab("Platelets", "low (monitor for dengue/bleeding)");
  if (!isNaN(wbcAbs) && wbcAbs > 11000) addLab("WBC", "high (infection/inflammation)");
  if (!isNaN(wbcAbs) && wbcAbs < 4000) addLab("WBC", "low (viral/other cause)");
  if (!isNaN(tsh) && tsh > 4.5) addLab("TSH", "high (hypothyroidism)");
  if (!isNaN(creat) && creat > creatHigh) addLab("Creatinine", "high (renal impairment)");
  if (!isNaN(esr) && esr > (sex === "Female" ? 20 : 15)) addLab("ESR", "high (inflammation/infection)");
  if (!isNaN(crp) && crp > 10) addLab("CRP", "high (inflammation/infection)");
  if (!isNaN(sodium) && (sodium < 136 || sodium > 145)) addLab("Sodium", sodium < 136 ? "low (hyponatraemia)" : "high (hypernatraemia)");
  if (!isNaN(potassium) && (potassium < 3.5 || potassium > 5)) addLab("Potassium", potassium < 3.5 ? "low (hypokalaemia)" : "high (hyperkalaemia)");
  if (labPos("Dengue NS1")) addLab("Dengue NS1", "positive (dengue)");
  if (labPos("Dengue IgM")) addLab("Dengue IgM", "positive (dengue)");
  if (labPos("Malaria Antigen")) addLab("Malaria Antigen", "positive (malaria)");
  if (labPos("Typhoid IgM")) addLab("Typhoid IgM", "positive (typhoid)");
  if (!isNaN(widalO) && widalO >= 125) addLab("Widal Typhi O", widalO >= 200 ? "positive (typhoid range; report cutoff >1:200)" : "borderline (repeat after 3 days)");
  if (!isNaN(widalH) && widalH >= 125) addLab("Widal Typhi H", widalH >= 200 ? "positive (supportive)" : "borderline (supportive; repeat after 3 days)");
  if (!isNaN(widalAH) && widalAH >= 200) addLab("Widal Para A H", "positive (paratyphoid A range)");
  if (!isNaN(widalBH) && widalBH >= 200) addLab("Widal Para B H", "positive (paratyphoid B range)");
  if (labPos("HBsAg")) addLab("HBsAg", "positive (hepatitis B — refer)");
  if (labPos("Anti-HCV")) addLab("Anti-HCV", "positive (hepatitis C — refer)");
  if (labPos("HIV")) addLab("HIV", "reactive (confirm/refer)");
  if (!isNaN(alt) && alt > altHigh) addLab("SGPT/ALT", "high (hepatocellular injury)");
  if (!isNaN(ast) && ast > altHigh) addLab("SGOT/AST", "high (hepatocellular injury)");
  if (!isNaN(bilirubin) && bilirubin > 1.2) addLab("Total Bilirubin", "high (jaundice/liver/biliary)");
  if (!isNaN(inr) && inr > 1.2) addLab("INR", "high (coagulation abnormality)");
  if (!isNaN(egfr) && egfr < 90) addLab("eGFR", "low (reduced renal function)");
  if (!isNaN(troponin) && troponin > 0.04) addLab("Troponin I", "high (cardiac injury — urgent)");
  if (!isNaN(dDimer) && dDimer > 500) addLab("D-Dimer", "high (thrombosis/inflammation)");
  if (!isNaN(procalc) && procalc > 0.5) addLab("Procalcitonin", "high (bacterial infection/sepsis)");
  if (labPos("Urine Nitrite")) addLab("Urine Nitrite", "positive (UTI)");
  if (labPos("Urine Leukocyte Esterase")) addLab("Urine Leukocyte Esterase", "positive (UTI/pyuria)");
  if (!isNaN(urineWbc) && urineWbc > 5) addLab("Urine WBC", "high (pyuria)");
  if (labPos("Urine Blood")) addLab("Urine Blood", "positive (haematuria)");
  if (labPos("Urine Protein")) addLab("Urine Protein", "positive (proteinuria)");
  if (labPos("Urine Glucose")) addLab("Urine Glucose", "positive (glycosuria)");
  Object.values(lab).forEach(v => {
    if (!v || seenLab.has(v.name)) return;
    if (v.flag === "High" || v.flag === "Low" || v.flag === "Positive") {
      addLab(v.name, (v.flag === "Positive" ? "positive" : v.flag.toLowerCase()) + " (report flag)");
    }
  });

  const redFlags = [];
  if (symptomText.includes("chest pain")) redFlags.push("Chest pain — rule out cardiac/MI, refer if acute");
  if (symptomText.includes("breathlessness")) redFlags.push("Breathlessness — assess SpO2, consider pneumonia/asthma/COPD");
  if (!isNaN(spo2) && spo2 < 94) redFlags.push("SpO2 " + spo2 + "% — hypoxia, urgent evaluation");
  if (!isNaN(temp) && temp >= 103) redFlags.push("High fever ≥103°F — investigate cause, watch for sepsis");
  if (symptomText.includes("confusion") || symptomText.includes("altered")) redFlags.push("Altered sensorium — emergency");
  if (symptomText.includes("bleeding")) redFlags.push("Bleeding — evaluate (dengue/menorrhagia)");
  if (symptomText.includes("blood in stool")) redFlags.push("Blood in stool — dysentery, refer if severe");
  if (symptomText.includes("severe dehydration") || symptomText.includes("no urine")) redFlags.push("Severe dehydration — urgent ORS/IV");
  if (symptomText.includes("high fever")) redFlags.push("High fever — investigate cause, watch for sepsis");
  if (symptomText.includes("seizure")) redFlags.push("Seizure — urgent evaluation");
  if (!isNaN(sugar) && sugar >= 300) redFlags.push("Blood sugar " + sugar + " mg/dL — very high, rule out DKA/HHS");
  if (!isNaN(sugar) && sugar < 70) redFlags.push("Blood sugar " + sugar + " mg/dL — hypoglycaemia, treat urgently");
  if (!isNaN(highSugar) && highSugar >= 300) redFlags.push("Report sugar " + highSugar + " mg/dL — very high, rule out DKA/HHS");
  if (!isNaN(highSugar) && highSugar < 70) redFlags.push("Report sugar " + highSugar + " mg/dL — hypoglycaemia, treat urgently");
  if (!isNaN(alt) && alt > 200) redFlags.push("ALT " + alt + " U/L — marked liver injury, review urgently");
  if (!isNaN(ast) && ast > 200) redFlags.push("AST " + ast + " U/L — marked liver injury, review urgently");
  if (!isNaN(bilirubin) && bilirubin > 3) redFlags.push("Bilirubin " + bilirubin + " mg/dL — significant jaundice, evaluate");
  if (!isNaN(inr) && inr > 1.5) redFlags.push("INR " + inr + " — abnormal coagulation, bleeding risk");
  if (!isNaN(egfr) && egfr < 30) redFlags.push("eGFR " + egfr + " — severe renal impairment, refer");
  if (!isNaN(troponin) && troponin > 0.04) redFlags.push("Troponin I " + troponin + " — possible myocardial injury, urgent");
  if (!isNaN(dDimer) && dDimer > 1000) redFlags.push("D-Dimer " + dDimer + " — marked elevation, consider thrombosis");
  if (!isNaN(procalc) && procalc > 2) redFlags.push("Procalcitonin " + procalc + " — possible sepsis, urgent review");
  if (labPos("Urine Nitrite") && !isNaN(temp) && temp >= 100.4) redFlags.push("UTI with fever — consider pyelonephritis/sepsis");
  if (!isNaN(hb) && hb < 7) redFlags.push("Severe anaemia (Hb " + hb + " g/dL) — urgent evaluation");
  if (!isNaN(plateletAbs) && plateletAbs < 50000) redFlags.push("Platelets " + plateletAbs + "/µL — high bleeding risk, urgent");
  if (!isNaN(wbcAbs) && (wbcAbs > 20000 || wbcAbs < 2000)) redFlags.push("WBC " + wbcAbs + "/µL — urgent review");
  if (!isNaN(creat) && creat > 2) redFlags.push("Creatinine " + creat + " mg/dL — renal impairment, refer");
  if (!isNaN(tsh) && tsh > 10) redFlags.push("TSH " + tsh + " — marked hypothyroidism, treat/refer");
  if (!isNaN(crp) && crp > 100) redFlags.push("CRP " + crp + " — severe inflammation/infection");
  if (!isNaN(potassium) && potassium > 6) redFlags.push("Potassium " + potassium + " mEq/L — hyperkalaemia, urgent");
  if (!isNaN(potassium) && potassium < 3) redFlags.push("Potassium " + potassium + " mEq/L — hypokalaemia, treat");
  if (!isNaN(sodium) && (sodium < 125 || sodium > 155)) redFlags.push("Sodium " + sodium + " mEq/L — severe sodium abnormality, urgent");
  if (labPos("Dengue NS1")) redFlags.push("Dengue NS1 positive — confirm and monitor platelets");
  if (labPos("Malaria Antigen")) redFlags.push("Malaria antigen positive — treat per protocol");
  if (labPos("HBsAg")) redFlags.push("HBsAg positive — hepatitis B, refer/confirm");
  if (labPos("Anti-HCV")) redFlags.push("Anti-HCV positive — hepatitis C, refer/confirm");
  if (labPos("HIV")) redFlags.push("HIV reactive — confirm and refer");

  const tests = new Set();
  top.slice(0, 3).forEach(c => (c.tests || []).forEach(t => tests.add(t)));
  const symptomatic = buildSymptomaticMeds({ age, symptoms, notes, vitals });
  const symptomaticAdvice = buildSymptomaticAdvice({ symptoms, notes, vitals });
  return { top, suggested, redFlags: [...new Set(redFlags)], tests: [...tests], labFindings, symptomatic, symptomaticAdvice };
}

function ageFromDob(dob) {
  if (!dob) return "";
  const d = new Date(dob + "T00:00:00");
  if (isNaN(d.getTime())) return "";
  const now = new Date();
  let a = now.getFullYear() - d.getFullYear();
  const m = now.getMonth() - d.getMonth();
  if (m < 0 || (m === 0 && now.getDate() < d.getDate())) a--;
  return a >= 0 ? a : "";
}

function Chart({ data, label, color }) {
  // data: [{date, value}]
  const pts = data.filter(d => d.value !== null && !isNaN(d.value));
  if (pts.length < 2) return <div className="empty" style={{padding:"12px"}}>Not enough data for {label}.</div>;
  const w = 320, h = 120, pad = 24;
  const vals = pts.map(d => d.value);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max - min) || 1;
  const xStep = (w - 2*pad) / (pts.length - 1);
  const points = pts.map((d,i) => {
    const x = pad + i * xStep;
    const y = h - pad - ((d.value - min) / range) * (h - 2*pad);
    return `${x},${y}`;
  }).join(" ");
  return (
    <div className="chart-wrap">
      <div style={{fontSize:12,fontWeight:600,color:"var(--muted)",marginBottom:4}}>{label}</div>
      <svg width="100%" viewBox={`0 0 ${w} ${h}`} style={{maxWidth:w}}>
        <polyline points={points} fill="none" stroke={color} strokeWidth="2" />
        {pts.map((d,i) => {
          const x = pad + i * xStep;
          const y = h - pad - ((d.value - min) / range) * (h - 2*pad);
          return <circle key={i} cx={x} cy={y} r="3" fill={color} />;
        })}
        <text x={pad} y={h-4} fontSize="9" fill="#64748b">{pts[0].date}</text>
        <text x={w-pad} y={h-4} fontSize="9" fill="#64748b" textAnchor="end">{pts[pts.length-1].date}</text>
      </svg>
      <div style={{fontSize:11,color:"var(--muted)"}}>min {min} · max {max} · latest {pts[pts.length-1].value}</div>
    </div>
  );
}

        const appMod = await import("https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js");
        const fsMod = await import("https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js");
        const app = appMod.initializeApp(FIREBASE_CONFIG);
        const db = fsMod.initializeFirestore(app, { localCache: fsMod.persistentLocalCache({ tabManager: fsMod.persistentMultipleTabManager() }) });
        const localUid = localStorage.getItem("ashvik_cloud_uid") || "ashvik-local";
        localStorage.setItem("ashvik_cloud_uid", localUid);
        const activeClinic = getClinicId();
        const activeDoctor = getDoctorId();
        cloudRef.current = { db, uid: localUid, fs: fsMod, clinicId: activeClinic, doctorId: activeDoctor };
        const col = fsMod.collection(db, "clinics", activeClinic, "doctors", activeDoctor, "patients");
        const existing = await fsMod.getDocs(col);
        if (existing.empty) {
          // One-time migration: old flat path or local cache -> clinic/doctor scope
          const legacyCol = fsMod.collection(db, "users", localUid, "patients");
          let source = [];
          try {
            const legacySnap = await fsMod.getDocs(legacyCol);
            if (!legacySnap.empty) source = legacySnap.docs.map(d => ({ id: d.id, ...d.data() }));
          } catch (e) { /* ignore legacy read errors */ }
          if (!source.length) source = loadPatients();
          if (source.length) {
            const batch = fsMod.writeBatch(db);
            source.forEach(p => batch.set(fsMod.doc(col, p.id), p));
            await batch.commit();
          }
        }
        if (cancelled) return;
        unsub = fsMod.onSnapshot(col, snap => {
          if (!navigator.onLine) setCloudStatus("offline");
          else if (snap.metadata.hasPendingWrites) setCloudStatus("syncing");
          else setCloudStatus("synced");
          const arr = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          setPatients(arr);
        }, (err) => { console.warn("Firestore listen failed", err); setCloudStatus("error"); });
      } catch (e) {

    setDmPlan({ ...a, patient: p, tpl, reportInfo: labInfo, complaint: dmComplaint, duration: dmDuration, severity: dmSeverity, vitals: dmVitals, chronic: dmChronic, allergies: dmAllergies, currentMeds: dmCurrentMeds, flags: dmFlags, date: new Date().toISOString().slice(0,10) });
    if (labInfo.values.length > 0) dmAsk(`Latest report se ${labInfo.values.length} lab values diagnosis me include ki gayi hain.`);
    dmAsk("Case summary aur management plan ready hai. Neeche dekhein — treatment edit karke prescription me bhej sakte hain. Final diagnosis aur prescription aapki approval se hoga.");
    setDmStep(6);
    setTimeout(() => document.getElementById("dmPlanCard")?.scrollIntoView({ behavior:"smooth" }), 80);
  };
  const dmLoadPrescription = () => {
    if (!dmPlan) return;
    const tpl = dmPlan.tpl;
    const sx = dmPlan.symptomatic || [];
    if (!tpl && sx.length === 0) { alert("No treatment template available. Prescribe manually."); return; }
    setConsultPatient(dmPatient);
    setConsult(prev => ({
      ...prev,
      bp: dmVitals.bp, pulse: dmVitals.pulse, temp: dmVitals.temp, spo2: dmVitals.spo2, weight: dmVitals.weight, sugar: dmVitals.sugar,
      symptoms: [...dmSymptoms], symptomNotes: dmNotes,
      diagnosis: tpl ? tpl.diagnosis : dmPlan.suggested,
      meds: withBrands(mergeMeds(tpl ? tpl.meds : [], sx)),
      advice: [tpl?.advice, ...(dmPlan.symptomaticAdvice || [])].filter(Boolean).join(" "),
      tests: dmPlan.tests.join(", ")
    }));
    setView("consult");
  };
  const dmSaveCase = () => {
    if (!dmPlan) return;
    const ps = [...patients];
    const p = ps.find(x => x.id === dmPatient);
    if (!p) return;
    const tpl = dmPlan.tpl;
    const meds = mergeMeds(tpl ? tpl.meds : [], dmPlan.symptomatic || []);
    const medsText = meds.map(m => `${m[0]} ${m[1]} ${m[2]} x ${m[3]}`).join("; ");
    p.clinical = p.clinical || [];
    p.clinical.push({
      id: uid(), date: dmPlan.date,
      complaint: `${dmPlan.complaint}${dmPlan.duration ? " · " + dmPlan.duration : ""} | Symptoms: ${dmSymptoms.join(", ")}${dmNotes ? " | " + dmNotes : ""}`,
      diagnosis: dmPlan.suggested,
      treatment: (medsText ? "Rx: " + medsText + " | " : "") + "Tests: " + dmPlan.tests.join(", "),
      notes: "ASHVIK Doctor plan. Red flags: " + (dmPlan.redFlags.join("; ") || "none") + " | Labs: " + ((dmPlan.labFindings || []).join("; ") || "none") + " | Symptomatic advice: " + ((dmPlan.symptomaticAdvice || []).join(" ") || "none")
    });
    setPatients(ps); savePatients(ps);
    setDmSaved(true);
    alert("Case saved to patient clinical history.");
  };

  // Reports
  const [reportModal, setReportModal] = useState(false);
  const [reportForm, setReportForm] = useState({ pid:"", date:"", name:"", result:"", notes:"", file:null });
  const [ocrStatus, setOcrStatus] = useState("idle");
  const [ocrProgress, setOcrProgress] = useState(0);
  const [ocrText, setOcrText] = useState("");
  const [ocrValues, setOcrValues] = useState([]);
  const [ocrError, setOcrError] = useState("");
  const ocrRunRef = useRef(0);
  const saveReport = () => {
    if (!reportForm.pid || !reportForm.date || !reportForm.name) { alert("Patient, date and test name required."); return; }
    const finish = (fileData, fileType, fileName) => {
      const ps = [...patients];
      const p = ps.find(x => x.id === reportForm.pid);
      p.reports = p.reports || [];
      p.reports.push({
        id:uid(), date:reportForm.date, name:reportForm.name, result:reportForm.result, notes:reportForm.notes,
        fileData, fileType, fileName,
        ocrText: ocrText || "",
        ocrValues: (ocrValues || []).map(({ line, ...v }) => v)
      });
      setPatients(ps); savePatients(ps);
      setSelectedId(reportForm.pid);
      setReportModal(false);
      setReportForm({ pid:"", date:"", name:"", result:"", notes:"", file:null });
      setOcrStatus("idle"); setOcrProgress(0); setOcrText(""); setOcrValues([]); setOcrError("");
    };
    if (reportForm.file) {
      const reader = new FileReader();
      reader.onload = e => finish(e.target.result, reportForm.file.type, reportForm.file.name);
      reader.readAsDataURL(reportForm.file);
    } else finish(null, null, null);
  };
  const deleteReport = (pid, rid) => {
    if (!confirm("Delete this report?")) return;
    const ps = [...patients];
    const p = ps.find(x => x.id === pid);
    p.reports = (p.reports || []).filter(r => r.id !== rid);
    setPatients(ps); savePatients(ps);
  };
  const [reportReturnView, setReportReturnView] = useState("doctor");
  const openDoctorReports = (pid, fromView) => {
    if (pid) setSelectedId(pid);
    setReportReturnView(fromView);
    setView("reports");
  };
  const openReportModal = () => {
    ocrRunRef.current++;
    setReportForm({ pid: selectedId || "", date: new Date().toISOString().slice(0,10), name:"", result:"", notes:"", file:null });
    setOcrStatus("idle"); setOcrProgress(0); setOcrText(""); setOcrValues([]); setOcrError("");
    setReportModal(true);
  };
  const runReportOCR = async (file) => {
    if (!file) return;
    const runId = ++ocrRunRef.current;
    const stale = () => ocrRunRef.current !== runId;
    setOcrStatus("loading"); setOcrProgress(0); setOcrText(""); setOcrValues([]); setOcrError("");
    try {
      const isPdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name || "");
      let text = "";
      if (isPdf) {
        text = await extractPdfText(file, (page, total) => {
          if (stale()) return;
          setOcrStatus("reading");
          setOcrProgress(Math.round((page / total) * 90));
        });
      } else if ((file.type || "").startsWith("image/")) {
        setOcrStatus("reading");
        _ocrProgress = m => {
          if (stale()) return;
          if (m.status === "recognizing text") setOcrProgress(Math.round((m.progress || 0) * 90));
        };
        text = await ocrImageFile(file);
      } else {
        throw new Error("Sirf PDF ya image file support hai.");
      }
      if (stale()) return;
      setOcrText(text);
      const p = patients.find(x => x.id === reportForm.pid);
      const seen = new Set();
      const values = [...parseLabValues(text, p?.sex), ...parseQualitative(text), ...parseWidal(text)]
        .filter(v => {
          if (!v || !v.name || seen.has(v.name)) return false;
          seen.add(v.name);
          return true;
        });
      setOcrValues(values);
      setOcrProgress(100);
      setOcrStatus("done");
      if (!text.trim()) setOcrError("Text nahi mila. Clear photo ya text-based PDF try karein.");
    } catch (e) {
      if (stale()) return;
      setOcrStatus("error");
      setOcrError(e.message || "Report read nahi ho payi.");
    } finally {
      _ocrProgress = null;
    }
  };
  const applyOcrValues = () => {
    if (!ocrValues.length) return;
    const lines = ocrValues.map(v => `${v.name}: ${v.value}${v.unit ? " " + v.unit : ""}${v.flag ? " (" + v.flag + ")" : ""}`).join("\n");
    setReportForm(prev => ({ ...prev, result: prev.result ? prev.result + "\n" + lines : lines }));
  };

  // History selected patient
  const [historyPatient, setHistoryPatient] = useState("");
  const [historySearch, setHistorySearch] = useState("");

  // Backup/restore
  const fileInputRef = useRef(null);
  const exportData = () => {
    const blob = new Blob([JSON.stringify(patients, null, 2)], { type: "application/json" });

    const a = document.createElement("a");
    a.href = url; a.download = "ashvik-backup-" + new Date().toISOString().slice(0,10) + ".json";
    a.click(); URL.revokeObjectURL(url);
    alert(t("exportOk", lang));
  };
  const importData = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!Array.isArray(data)) throw new Error("bad");
        savePatients(data);
        setPatients(data);
        alert(t("importOk", lang));
      } catch { alert(t("importErr", lang)); }
    };
    reader.readAsText(f);
    e.target.value = "";
  };

  // Dashboard stats
  const stats = useMemo(() => {
    let consults = 0, follow = 0;
    const now = new Date();
    const recent = [];
    patients.forEach(p => {
      (p.consults || []).forEach(c => {
        const d = new Date(c.date);
        if (d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear()) consults++;
        if (c.follow) {
          const fd = new Date(c.follow);
          if (fd >= new Date(now.toDateString()) && fd <= new Date(now.getTime() + 7*86400000)) follow++;
        }
        recent.push({ date: c.date, name: p.name, diagnosis: c.diagnosis, pid: p.id, cid: c.id });
      });
    });
    recent.sort((a,b) => b.date.localeCompare(a.date));
    return { consults, follow, recent: recent.slice(0,8) };
  }, [patients]);

  const consultsOf = (pid) => {
    const p = patients.find(x => x.id === pid);
    return p ? (p.consults || []).slice().sort((a,b) => b.date.localeCompare(a.date)) : [];
  };

  // Vitals trend data for selected patient (history view)
  const trendPatient = patients.find(x => x.id === (historyPatient || selectedId));
  const trendData = trendPatient ? (trendPatient.consults || []).slice().sort((a,b) => a.date.localeCompare(b.date)) : [];
  const bpTrend = trendData.map(c => ({ date: c.date.slice(5), value: parseFloat((c.vitals.bp||"").split("/")[0]) }));
  const sugarTrend = trendData.map(c => ({ date: c.date.slice(5), value: parseFloat(c.vitals.sugar) }));
  const weightTrend = trendData.map(c => ({ date: c.date.slice(5), value: parseFloat(c.vitals.weight) }));

  return (
    <div className="app">
      <Sidebar view={view} setView={setView} lang={lang} setLang={setLang} t={t} cloudStatus={cloudStatus} />
      <main className="main">
        {view === "dashboard" && (
          <>
            <div className="page-head">
              <div><h2>{t("dashboard",lang)}</h2><p>{t("tag",lang)}</p></div>
              <div className="topbar-actions">
                <span className={"badge " + (online ? "badge-m" : "badge-o")}>{online ? t("online",lang) : t("offline",lang)}</span>
                <button className="btn btn-primary" onClick={() => setView("consult")}>{t("consult",lang)}</button>
              </div>
            </div>
            <div className="grid grid-3" style={{gap:10}}>
              <div className="card" style={{padding:"12px 14px"}}><h3 style={{fontSize:13,marginBottom:6}}>{t("patientsCount",lang)}</h3><div style={{fontSize:22,fontWeight:700,color:"var(--primary)"}}>{patients.length}</div></div>
              <div className="card" style={{padding:"12px 14px"}}><h3 style={{fontSize:13,marginBottom:6}}>{t("consultsMonth",lang)}</h3><div style={{fontSize:22,fontWeight:700,color:"var(--accent)"}}>{stats.consults}</div></div>
              <div className="card" style={{padding:"12px 14px"}}><h3 style={{fontSize:13,marginBottom:6}}>{t("followups",lang)}</h3><div style={{fontSize:22,fontWeight:700,color:"var(--warn)"}}>{stats.follow}</div></div>
            </div>
            <div className="card" style={{padding:"12px 16px",marginBottom:12}}>
              <div className="card-head" style={{marginBottom:8}}><h3 style={{fontSize:14}}>{t("quickActions",lang)}</h3></div>
              <button className="btn btn-primary btn-sm" onClick={() => setView("consult")}>+ {t("consult",lang)}</button>
              <button className="btn btn-outline btn-sm" onClick={() => setView("patients")} style={{marginLeft:6}}>{t("patients",lang)}</button>
              <button className="btn btn-outline btn-sm" onClick={() => setView("doctor")} style={{marginLeft:6}}>🤖 ASHVIK Doctor</button>
            </div>
            <div className="card" style={{padding:"12px 16px",marginBottom:12}}>
              <div className="card-head" style={{marginBottom:8}}><h3 style={{fontSize:14}}>{t("recentConsults",lang)}</h3></div>
              {stats.recent.length === 0 ? <div className="empty">{t("noData",lang)}</div> :
                <table><thead><tr><th>{t("date",lang)}</th><th>{t("name",lang)}</th><th>{t("diagnosisLabel",lang)}</th><th></th></tr></thead><tbody>
                  {stats.recent.map(r => (
                    <tr key={r.cid}><td>{r.date}</td><td>{escapeHtml(r.name)}</td><td>{escapeHtml(r.diagnosis)}</td>
                      <td><button className="btn btn-outline btn-sm" onClick={() => { setHistoryPatient(r.pid); setView("history"); }}>{t("view",lang)}</button></td></tr>
                  ))}
                </tbody></table>}
            </div>
          </>
        )}

        {view === "patients" && (
          <>
            <div className="page-head">
              <div><h2>{t("patients",lang)}</h2><p>{t("allPatients",lang)}</p></div>
              <button className="btn btn-primary" onClick={() => openPatientModal()}>+ {t("addPatient",lang)}</button>
            </div>
            <div className="card">
              <input placeholder={t("search",lang)} style={{width:"100%",padding:"9px 12px",border:"1px solid var(--border)",borderRadius:10,marginBottom:10}} onChange={e => {
                const q = e.target.value.toLowerCase();
                document.querySelectorAll(".pat-row").forEach(row => {
                  row.style.display = row.textContent.toLowerCase().includes(q) ? "" : "none";
                });
              }} />
              {patients.length === 0 ? <div className="empty">{t("noPatients",lang)}</div> :
                <table><thead><tr><th>{t("name",lang)}</th><th>{t("age",lang)}</th><th>{t("sex",lang)}</th><th>{t("phone",lang)}</th><th></th></tr></thead><tbody>
                  {patients.map(p => (
                    <tr key={p.id} className="pat-row">
                      <td>{escapeHtml(p.name)}</td><td>{p.age}</td><td><span className={"badge " + (p.sex==="Male"?"badge-m":p.sex==="Female"?"badge-f":"badge-o")}>{p.sex}</span></td><td>{escapeHtml(p.phone||"-")}</td>
                      <td>
                        <button className="btn btn-outline btn-sm" onClick={() => openPatientModal(p)}>{t("edit",lang)}</button>{" "}
                        <button className="btn btn-danger btn-sm" onClick={() => deletePatient(p.id)}>{t("delete",lang)}</button>{" "}
                        <button className="btn btn-outline btn-sm" onClick={() => { setConsultPatient(p.id); setView("consult"); }}>{t("startConsult",lang)}</button>
                      </td>
                    </tr>
                  ))}
                </tbody></table>}
            </div>
          </>
        )}

        {view === "doctor" && (
          <>
            <div className="page-head">
              <div><h2>🤖 ASHVIK Doctor</h2><p>Guided case-taking → differential diagnosis → treatment plan</p></div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                <button className="btn btn-outline" onClick={() => setView("diagnosis")}>⚡ Quick Differential</button>
                <button className="btn btn-outline" onClick={() => openDoctorReports(dmPatient, "doctor")}>📋 Reports</button>
                <button className="btn btn-outline" onClick={dmReset}>New Case</button>
              </div>
            </div>

            <div className="card">
              <div className="card-head"><h3>Consultation</h3><span className="sub">ASHVIK asks, you answer</span></div>
              <div className="chat">
                {dmMessages.length === 0 && <div className="msg ashvik"><div className="who">ASHVIK</div>Namaste. Patient select karke "Start Consultation" dabayein. Main guided case-taking karunga aur management plan banaunga. Agar symptoms already pate hain to upar ⚡ Quick Differential use karein.</div>}
                {dmMessages.map((m,i) => (
                  <div key={i} className={"msg " + m.role}><div className="who">{m.role === "ashvik" ? "ASHVIK" : "Doctor"}</div>{m.text}</div>
                ))}
              </div>
            </div>

            {dmStep === 0 && (
              <div className="card">
                <div className="card-head"><h3>1. Patient</h3></div>
                <div className="grid grid-2">
                  <Field label="Select patient *">
                    <select value={dmPatient} onChange={e => setDmPatient(e.target.value)}>
                      <option value="">-- Select Patient --</option>
                      {patients.map(p => <option key={p.id} value={p.id}>{p.name} ({p.age}/{p.sex})</option>)}
                    </select>
                    <button type="button" className="btn btn-outline btn-sm" style={{marginTop:6}} onClick={() => openPatientModal()}>+ New Patient</button>
                  </Field>
                  <Field label="Selected patient">
                    <input readOnly value={(() => { const p = patients.find(x => x.id === dmPatient); return p ? `${p.name} · ${p.age}/${p.sex} · ${p.phone || "no phone"}` : "—"; })()} />
                  </Field>
                </div>
                <button className="btn btn-primary" style={{marginTop:10}} onClick={dmStart}>Start Consultation →</button>
              </div>
            )}

            {dmStep === 1 && (
              <div className="card">
                <div className="card-head"><h3>2. Chief Complaint</h3></div>
                <Field label="Chief complaint *"><input placeholder="e.g. Fever with cough" value={dmComplaint} onChange={e => setDmComplaint(e.target.value)} /></Field>
                <div className="grid grid-2" style={{marginTop:10}}>
                  <Field label="Duration"><input placeholder="e.g. 3 days" value={dmDuration} onChange={e => setDmDuration(e.target.value)} /></Field>
                  <Field label="Severity (1-10)"><input type="number" min="1" max="10" value={dmSeverity} onChange={e => setDmSeverity(e.target.value)} /></Field>
                </div>
                <button className="btn btn-primary" style={{marginTop:10}} onClick={dmNextFromComplaint}>Next →</button>
              </div>
            )}

            {dmStep === 2 && (
              <div className="card">
                <div className="card-head"><h3>3. Symptoms</h3></div>
                <div>{SYMPTOMS.map(s => <Chip key={s} label={s} active={dmSymptoms.includes(s)} onClick={() => dmToggleSymptom(s)} />)}</div>
                <Field label="Associated symptoms / notes" style={{marginTop:10}}>
                  <textarea placeholder="Onset, duration, associated symptoms..." value={dmNotes} onChange={e => setDmNotes(e.target.value)} />
                </Field>
                <button className="btn btn-primary" style={{marginTop:10}} onClick={dmNextFromSymptoms}>Next →</button>
              </div>
            )}

            {dmStep === 3 && (
              <div className="card">
                <div className="card-head"><h3>4. Vitals</h3></div>
                <div className="grid grid-4">
                  <Field label="BP"><input placeholder="120/80" value={dmVitals.bp} onChange={e => setDmVitals({...dmVitals, bp:e.target.value})} /></Field>
                  <Field label="Pulse"><input type="number" value={dmVitals.pulse} onChange={e => setDmVitals({...dmVitals, pulse:e.target.value})} /></Field>
                  <Field label="Temp (°F)"><input type="number" step="0.1" value={dmVitals.temp} onChange={e => setDmVitals({...dmVitals, temp:e.target.value})} /></Field>
                  <Field label="SpO2 (%)"><input type="number" value={dmVitals.spo2} onChange={e => setDmVitals({...dmVitals, spo2:e.target.value})} /></Field>
                </div>
                <div className="grid grid-2" style={{marginTop:10}}>
                  <Field label="Weight (kg)"><input type="number" step="0.1" value={dmVitals.weight} onChange={e => setDmVitals({...dmVitals, weight:e.target.value})} /></Field>
                  <Field label="Blood Sugar (mg/dL)"><input type="number" value={dmVitals.sugar} onChange={e => setDmVitals({...dmVitals, sugar:e.target.value})} /></Field>
                </div>
                <button className="btn btn-primary" style={{marginTop:10}} onClick={dmNextFromVitals}>Next →</button>
              </div>
            )}

            {dmStep === 4 && (
              <div className="card">
                <div className="card-head"><h3>5. History</h3></div>
                <Field label="Chronic conditions"><input value={dmChronic} onChange={e => setDmChronic(e.target.value)} /></Field>
                <div className="grid grid-2" style={{marginTop:10}}>
                  <Field label="Allergies"><input value={dmAllergies} onChange={e => setDmAllergies(e.target.value)} /></Field>
                  <Field label="Current medicines"><input value={dmCurrentMeds} onChange={e => setDmCurrentMeds(e.target.value)} /></Field>
                </div>
                <button className="btn btn-primary" style={{marginTop:10}} onClick={dmNextFromHistory}>Next →</button>
              </div>
            )}

            {dmStep === 5 && (
              <div className="card">
                <div className="card-head"><h3>6. Red Flags</h3></div>
                <div>{RED_FLAG_QUESTIONS.map(f => <Chip key={f} label={f} active={dmFlags.includes(f)} onClick={() => dmToggleFlag(f)} />)}</div>
                <div style={{marginTop:10,fontSize:12,color:"var(--muted)"}}>Koi bhi red flag ho to urgent evaluation/referral consider karein.</div>
                <button className="btn btn-primary" style={{marginTop:10}} onClick={dmGenerate}>Generate ASHVIK Plan →</button>
              </div>
            )}

            {dmStep === 6 && dmPlan && (
              <div className="card" id="dmPlanCard">
                <div className="card-head"><h3>ASHVIK Case Sheet & Management Plan</h3><span className="sub">{dmPlan.date}</span></div>
                <div className="dm-plan">
                  <h4>Patient</h4>
                  <div style={{fontSize:13}}><b>{dmPlan.patient.name}</b> · {dmPlan.patient.age}/{dmPlan.patient.sex} · {dmPlan.patient.phone || "no phone"}<br/>Allergy: {dmPlan.allergies || "none"} · Chronic: {dmPlan.chronic || "none"}</div>
                </div>
                <div className="dm-plan">
                  <h4>Case Summary</h4>
                  <div style={{fontSize:13}}>
                    <b>Complaint:</b> {dmPlan.complaint}{dmPlan.duration ? " · " + dmPlan.duration : ""}{dmPlan.severity ? " · severity " + dmPlan.severity + "/10" : ""}<br/>
                    <b>Symptoms:</b> {dmSymptoms.join(", ") || "—"}{dmNotes ? " | " + dmNotes : ""}<br/>
                    <b>Vitals:</b> BP {dmPlan.vitals.bp || "—"} · Pulse {dmPlan.vitals.pulse || "—"} · Temp {dmPlan.vitals.temp || "—"} · SpO2 {dmPlan.vitals.spo2 || "—"} · Wt {dmPlan.vitals.weight || "—"} · Sugar {dmPlan.vitals.sugar || "—"}
                  </div>
                </div>
                {dmPlan.redFlags.length > 0 && (
                  <div className="alert alert-danger"><b>Red flags:</b><ul>{dmPlan.redFlags.map((r,i) => <li key={i}>{r}</li>)}</ul></div>
                )}
                {dmPlan.labFindings && dmPlan.labFindings.length > 0 && (
                  <div className="alert alert-info"><b>Report-based findings:</b><ul>{dmPlan.labFindings.map((f,i) => <li key={i}>{f}</li>)}</ul></div>
                )}
                <div className="alert alert-success"><b>ASHVIK impression:</b> {dmPlan.suggested} <span style={{color:"var(--muted)",fontSize:12}}>(score {dmPlan.top[0]?.score || 0})</span></div>
                {(() => {
                  const extra = extraMeds(dmPlan.tpl ? dmPlan.tpl.meds : [], dmPlan.symptomatic || []);
                  const advice = dmPlan.symptomaticAdvice || [];
                  if (!extra.length) return null;
                  return (
                    <div className="alert alert-warn">
                      <b>Symptomatic treatment</b>
                      <ul style={{margin:"6px 0 0 18px",padding:0,fontSize:13}}>
                        {extra.map((m,i) => (
                          <li key={i} style={{marginBottom:4}}>
                            <b>{m[0]}</b> — {m[1]} · {m[2]} · {m[3]}{m[4] ? " · " + m[4] : ""}
                            {BRANDS[m[0]] && <div style={{fontSize:11,color:"var(--muted)"}}>Brands: {BRANDS[m[0]]}</div>}
                          </li>
                        ))}
                      </ul>
                      {advice.length > 0 && <div style={{fontSize:12,marginTop:4}}>{advice.join(" ")}</div>}
                    </div>
                  );
