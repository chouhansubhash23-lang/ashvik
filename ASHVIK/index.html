                    <div className="card-head"><h3>{t("consult",lang)} ({consults.length})</h3></div>
                    {consults.length === 0 ? <div className="empty">{t("noData",lang)}</div> :
                      consults.map(c => (
                        <div className="history-item" key={c.id}>
                          <b>{c.date}</b> — {c.diagnosis}<br/>
                          <span style={{fontSize:13}}>{t("symptoms",lang)}: {(c.symptoms||[]).join(", ")}</span><br/>
                          <span style={{fontSize:13}}>Vitals: BP {c.vitals.bp||"-"} | Pulse {c.vitals.pulse||"-"} | Temp {c.vitals.temp||"-"} | SpO2 {c.vitals.spo2||"-"} | Wt {c.vitals.weight||"-"} | Sugar {c.vitals.sugar||"-"}</span><br/>
                          <span style={{fontSize:13}}>Rx: {(c.meds||[]).map(m=>m[0]).join(", ") || "-"}</span><br/>
                          <span style={{fontSize:13}}>{t("advice",lang)}: {c.advice||"-"}</span>
                        </div>
                      ))}
                  </div>
                  <div className="card">
                    <div className="card-head"><h3>{t("reports",lang)}</h3></div>
                    {reports.length === 0 ? <div className="empty">{t("noData",lang)}</div> :
                      reports.map(r => (
                        <div className="history-item" key={r.id}>
                          <b>{r.name}</b> ({r.date}) — {r.result||"-"}
                          {r.fileData && <span> <a href={r.fileData} target="_blank">📎</a></span>}
                        </div>
                      ))}
                  </div>
                  <div className="card">
                    <div className="card-head"><h3>{t("clinicalHistory",lang)}</h3></div>
                    {(p.clinical||[]).length === 0 ? <div className="empty">{t("noData",lang)}</div> :
                      (p.clinical||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)).map(e => (
                        <div className="history-item" key={e.id}>
                          <b>{e.date}</b> — {e.diagnosis}<br/>
                          <span style={{fontSize:13}}>{e.complaint}</span><br/>
                          <span style={{fontSize:13,color:"var(--muted)"}}>{e.treatment}</span>
                        </div>
                      ))}
                  </div>
                  <div className="card">
                    <div className="card-head"><h3>{t("trend",lang)}</h3></div>
                    <div className="grid grid-3">
                      <Chart data={bpTrend} label={t("systolic",lang)} color="#0f766e" />
                      <Chart data={sugarTrend} label={t("sugar",lang)} color="#2563eb" />
                      <Chart data={weightTrend} label={t("weight",lang)} color="#d97706" />
                    </div>
                  </div>
                </>
              );
            })()}
          </>
        )}

        {view === "reports" && (
          <>
            <div className="page-head">
              <div><h2>📋 Test Reports</h2><p>ASHVIK Doctor · patient reports & uploads</p></div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                <button className="btn btn-outline" onClick={() => setView(reportReturnView)}>← {reportReturnView === "diagnosis" ? "Quick Differential" : "ASHVIK Doctor"}</button>
                <button className="btn btn-primary" onClick={openReportModal}>{t("addReport",lang)}</button>
              </div>
            </div>
            <div className="card">
              <Field label={t("selectPatient",lang)}>
                <select value={selectedId} onChange={e => setSelectedId(e.target.value)}>
                  <option value="">-- {t("selectPatient",lang)} --</option>
                  {patients.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                </select>
              </Field>
            </div>
            {!selectedPatient ? <div className="card empty">{t("selectPatient",lang)}</div> :
              (selectedPatient.reports||[]).length === 0 ? <div className="card empty">{t("noData",lang)}</div> :
              (selectedPatient.reports||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)).map(r => {
                const rv = getReportLabs(r);
                return (
                  <div className="report-card" key={r.id}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                      <h3 style={{margin:0,fontSize:15}}>{r.name} <span style={{fontSize:12,color:"var(--muted)",fontWeight:400}}>{r.date}</span></h3>
                      <button className="btn btn-danger btn-sm" onClick={() => deleteReport(selectedId, r.id)}>{t("delete",lang)}</button>
                    </div>
                    <div style={{marginTop:8}}><b>{t("result",lang)}:</b> {r.result || "-"}</div>
                    {r.notes && <div><b>{t("reportNotes",lang)}:</b> {r.notes}</div>}
                    {rv.length > 0 && (
                      <details style={{marginTop:6,fontSize:12}}>
                        <summary style={{cursor:"pointer",fontWeight:600}}>Parsed values ({rv.length})</summary>
                        <div style={{marginTop:4}}>
                          {rv.map((v, i) => <span key={i} style={{display:"inline-block",marginRight:10,marginBottom:2}}>{v.name}: <b>{labValueText(v)}</b>{v.flag ? " (" + v.flag + ")" : ""}<span style={{color:"var(--muted)"}}> · Ref {labRefText(v.name, selectedPatient.sex)}</span></span>)}
                        </div>
                      </details>
                    )}
                    {r.ocrText && (
                      <details style={{marginTop:4,fontSize:12}}>
                        <summary style={{cursor:"pointer",color:"var(--muted)"}}>OCR text</summary>
                        <pre style={{whiteSpace:"pre-wrap",fontSize:11,maxHeight:180,overflow:"auto"}}>{r.ocrText}</pre>
                      </details>
                    )}
                    {r.fileData && <div style={{marginTop:8}}><a href={r.fileData} target="_blank" download={r.fileName||"report"}>📎 {r.fileName || "View file"}</a></div>}
                  </div>
                );
              })}
            <details className="card" style={{marginTop:10}}>
              <summary style={{cursor:"pointer",fontWeight:600}}>📚 Basic lab reference ranges ({LAB_TESTS.length} quantitative tests)</summary>
              <div style={{fontSize:12,color:"var(--muted)",marginTop:6}}>
                Typical adult intervals used by Indian NABL-accredited labs (cross-checked against Focus Diagnostics' 2025 reference chart and standard clinical cut-offs). Always prefer the range printed on the patient's own report.
              </div>
              <div style={{fontSize:12,color:"var(--muted)",marginTop:4}}>
                Qualitative/serology (dengue, malaria, typhoid, HBsAg, HCV, HIV, VDRL, urine dipstick, stool) is expected negative/non-reactive. Widal: O ≥1:200 positive, 1:125–199 borderline.
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(260px,1fr))",gap:"5px 16px",marginTop:8,fontSize:12}}>
                {LAB_TESTS.map(t => (
                  <div key={t.name}>
                    <b>{t.name}</b>: {labRefText(t.name, selectedPatient?.sex || "Male")}
                    <span style={{color:"var(--muted)"}}> · {t.category}</span>
                  </div>
                ))}
              </div>
              <div style={{fontSize:11,color:"var(--muted)",marginTop:8}}>
                Paediatric, pregnancy, critical-care and some method-specific ranges differ. The doctor must verify the lab's own reference interval before acting.
              </div>
            </details>
          </>
        )}

        {view === "settings" && (
          <>
            <div className="page-head"><div><h2>{t("settings",lang)}</h2><p>Clinic, doctor, data and app settings</p></div></div>
            <div className="card">
              <div className="card-head"><h3>Clinic / Company & Doctor</h3></div>
              <div className="grid grid-2">
                <Field label="Clinic / Company ID">
                  <input value={clinicId} onChange={e => setClinicId(e.target.value)} placeholder="e.g. clinic-varanasi-01" />
                </Field>
                <Field label="Doctor ID">
                  <input value={doctorId} onChange={e => setDoctorId(e.target.value)} placeholder="e.g. doctor-sunita" />
                </Field>
              </div>
              <div style={{marginTop:10,fontSize:12,color:"var(--muted)"}}>
                Patient data is isolated per clinic and doctor: <code>clinics/{clinicId}/doctors/{doctorId}/patients</code>
              </div>
              <button className="btn btn-primary" style={{marginTop:10}}
                onClick={() => { localStorage.setItem("ashvik_clinic_id", clinicId.trim() || DEFAULT_CLINIC); localStorage.setItem("ashvik_doctor_id", doctorId.trim() || DEFAULT_DOCTOR); location.reload(); }}>
                Save & Reload
              </button>
            </div>
            <div className="card">
              <div className="card-head"><h3>{t("backup",lang)}</h3></div>
              <button className="btn btn-primary" onClick={exportData}>{t("backup",lang)}</button>
              <button className="btn btn-outline" style={{marginLeft:8}} onClick={() => fileInputRef.current && fileInputRef.current.click()}>{t("restore",lang)}</button>
              <input ref={fileInputRef} type="file" accept="application/json" style={{display:"none"}} onChange={importData} />
              <div style={{marginTop:10,fontSize:12,color:"var(--muted)"}}>Export all patient data to JSON for backup. Restore from a previously exported file.</div>
            </div>
            <div className="card">
              <div className="card-head"><h3>{t("language",lang)}</h3></div>
              <select value={lang} onChange={e => setLang(e.target.value)} style={{padding:"9px 12px",border:"1px solid var(--border)",borderRadius:10}}>
                <option value="en">English</option>
                <option value="hi">हिन्दी (Hindi)</option>
                <option value="bn">বাংলা (Bangla)</option>
              </select>
            </div>
            <div className="card">
              <div className="card-head"><h3>Install as App (PWA)</h3></div>
              <div style={{fontSize:13,color:"var(--muted)"}}>Use browser menu → "Install ASHVIK" or "Add to Home Screen" for offline use.</div>
            </div>
          </>
        )}
      </main>

      {/* Patient Modal */}
      <div className={"modal-backdrop" + (patientModal ? " open" : "")} onClick={() => setPatientModal(false)}>
        <div className="modal" onClick={e => e.stopPropagation()}>
          <h3>{editingPatientId ? t("edit",lang) : t("addPatient",lang)}</h3>
          <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:12,flexWrap:"wrap"}}>
            <span style={{fontSize:12,color:"var(--muted)"}}>Age input:</span>
            <button type="button" className={"btn btn-sm " + (ageMode === "age" ? "btn-primary" : "btn-outline")} onClick={() => setAgeMode("age")}>Enter Age</button>
            <button type="button" className={"btn btn-sm " + (ageMode === "dob" ? "btn-primary" : "btn-outline")} onClick={() => setAgeMode("dob")}>Use DOB (auto age)</button>
          </div>
          <div className="grid grid-2">
            <Field label={t("name",lang) + " *"}><input value={patientForm.name} onChange={e => setPatientForm({...patientForm, name: e.target.value})} /></Field>
            <Field label={t("age",lang) + " *"}>
              <input type="number" min="0" placeholder={ageMode === "dob" ? "Auto from DOB" : "Years"} value={patientForm.age} readOnly={ageMode === "dob"} onChange={e => setPatientForm({...patientForm, age: e.target.value})} />
            </Field>
            <Field label={t("sex",lang) + " *"}>
              <select value={patientForm.sex} onChange={e => setPatientForm({...patientForm, sex: e.target.value})}>
                <option>Male</option><option>Female</option><option>Other</option>
              </select>
            </Field>
            <Field label={t("dob",lang) + (ageMode === "dob" ? " *" : " (optional)")}>
              <input type="date" value={patientForm.dob} onChange={e => {
                const dob = e.target.value;
                setPatientForm(prev => ({ ...prev, dob, ...(dob ? { age: String(ageFromDob(dob)) } : {}) }));
              }} />
            </Field>
            <Field label={t("phone",lang)}><input value={patientForm.phone} onChange={e => setPatientForm({...patientForm, phone: e.target.value})} /></Field>
            <Field label={t("bloodGroup",lang)}><input value={patientForm.bloodGroup} onChange={e => setPatientForm({...patientForm, bloodGroup: e.target.value})} /></Field>
          </div>
          <Field label={t("address",lang)} style={{marginTop:10}}><textarea value={patientForm.address} onChange={e => setPatientForm({...patientForm, address: e.target.value})} /></Field>
          <Field label={t("allergies",lang)} style={{marginTop:10}}><input value={patientForm.allergies} onChange={e => setPatientForm({...patientForm, allergies: e.target.value})} /></Field>
          <Field label={t("chronic",lang)} style={{marginTop:10}}><input value={patientForm.chronic} onChange={e => setPatientForm({...patientForm, chronic: e.target.value})} /></Field>
          <Field label={t("notes",lang)} style={{marginTop:10}}><textarea value={patientForm.notes} onChange={e => setPatientForm({...patientForm, notes: e.target.value})} /></Field>
          <div className="modal-actions">
            <button className="btn btn-outline" onClick={() => setPatientModal(false)}>{t("cancel",lang)}</button>
            <button className="btn btn-primary" onClick={savePatient}>{t("save",lang)}</button>
          </div>
        </div>
      </div>

      {/* Report Modal */}
      <div className={"modal-backdrop" + (reportModal ? " open" : "")} onClick={() => setReportModal(false)}>
        <div className="modal" onClick={e => e.stopPropagation()}>
          <h3>{t("addReport",lang)}</h3>
          <Field label={t("selectPatient",lang) + " *"}>
            <select value={reportForm.pid} onChange={e => setReportForm({...reportForm, pid: e.target.value})}>
              <option value="">-- {t("selectPatient",lang)} --</option>
              {patients.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </Field>
          <Field label={t("date",lang) + " *"}><input type="date" value={reportForm.date} onChange={e => setReportForm({...reportForm, date: e.target.value})} /></Field>
          <Field label={t("reportName",lang) + " *"}><input placeholder="CBC, Malaria RDT, CXR..." value={reportForm.name} onChange={e => setReportForm({...reportForm, name: e.target.value})} /></Field>
          <Field label={t("reportResult",lang)}><textarea value={reportForm.result} onChange={e => setReportForm({...reportForm, result: e.target.value})} /></Field>
          <Field label={t("reportNotes",lang)}><textarea value={reportForm.notes} onChange={e => setReportForm({...reportForm, notes: e.target.value})} /></Field>
          <Field label={t("attachFile",lang)}>
            <input type="file" accept=".pdf,image/*" onChange={e => {
              const file = e.target.files[0] || null;
              setReportForm({...reportForm, file});
              if (file) runReportOCR(file);
              else { setOcrStatus("idle"); setOcrProgress(0); setOcrText(""); setOcrValues([]); setOcrError(""); }
            }} />
          </Field>
          {ocrStatus !== "idle" && (
            <div className="ocr-panel">
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
                <b>🩺 Report Reader (offline OCR)</b>
                <span style={{fontSize:11,color:"var(--muted)"}}>
                  {ocrStatus === "loading" ? "Preparing..." : ocrStatus === "reading" ? "Reading " + ocrProgress + "%" : ocrStatus === "done" ? "Done" : "Error"}
                </span>
              </div>
              {(ocrStatus === "loading" || ocrStatus === "reading") && (
                <div className="score-bar" style={{marginTop:6}}><div className="score-fill" style={{width: Math.max(4, ocrProgress) + "%"}}></div></div>
              )}
              {ocrError && <div className="alert alert-danger" style={{marginTop:8}}>{ocrError}</div>}
              {ocrText && (
                <>
                  <Field label="Extracted text (verify before saving)" style={{marginTop:8}}>
                    <textarea rows="4" value={ocrText} onChange={e => setOcrText(e.target.value)} />
                  </Field>
                  {ocrValues.length > 0 ? (
                    <div style={{marginTop:8}}>
                      <div style={{fontSize:12,fontWeight:600,marginBottom:4}}>Detected values <span style={{fontWeight:400,color:"var(--muted)"}}>(typical adult range; doctor verify)</span></div>
                      <table style={{width:"100%",fontSize:12}}>
                        <thead><tr><th align="left">Test</th><th align="left">Value</th><th align="left">Reference</th><th align="left">Flag</th></tr></thead>
                        <tbody>
                          {ocrValues.map((v, i) => (
                            <tr key={i}>
                              <td>{v.name}</td>
                              <td>{labValueText(v)}</td>
                              <td style={{color:"var(--muted)"}}>{labRefText(v.name, patients.find(x => x.id === reportForm.pid)?.sex) || "—"}</td>
                              <td style={{fontWeight:600,color:v.flag === "Positive" || v.flag === "High" ? "var(--danger)" : v.flag === "Low" ? "var(--warn)" : "var(--muted)"}}>{v.flag || "—"}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                      <button type="button" className="btn btn-outline btn-sm" style={{marginTop:6}} onClick={applyOcrValues}>Use detected values in Result</button>
                    </div>
                  ) : (
                    <div style={{fontSize:12,color:"var(--muted)",marginTop:6}}>Koi known lab value detect nahi hui. Text verify karke Result me likhein.</div>
                  )}
                </>
              )}
            </div>
          )}
          <div className="modal-actions">
            <button className="btn btn-outline" onClick={() => setReportModal(false)}>{t("cancel",lang)}</button>
            <button className="btn btn-primary" onClick={saveReport}>{t("save",lang)}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

// Register service worker for PWA offline
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js?v=5").then(reg => {
      reg.update().catch(() => {});
    }).catch(() => {});
  });
  let swRefreshing = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (swRefreshing) return;
    swRefreshing = true;
    window.location.reload();
  });
}
</script>
</body>
</html>
